# T27-First Enforcement Configuration
# Deployment Mode: AUDIT/BLOCK-NEW (not full enforcement)
# Status: ENFORCEMENT_IMPLEMENTED_AUDIT_MODE
# Violations: 198_BASELINED

# Mode configuration
enforcement_mode: "BLOCK_NEW"  # Options: AUDIT_ONLY, BLOCK_NEW, CRITICAL_MIGRATION, FULL_ENFORCEMENT
baseline_file: "specs/architecture/misplaced-logic-inventory.t27"
current_violations: 198

# Mode definitions
modes:
  AUDIT_ONLY:
    description: "Report all violations but don't block anything"
    block_new: false
    block_existing: false
    report_only: true
    ci_integration: false
    
  BLOCK_NEW:
    description: "Block new business logic; existing violations remain baselined"
    block_new: true
    block_existing: false
    report_only: false
    ci_integration: true
    baseline_suppression: true
    
  CRITICAL_MIGRATION:
    description: "Migrate critical paths first (agent runner, session lifecycle, provider policy)"
    block_new: true
    block_existing: false
    report_only: false
    ci_integration: true
    priority_migration: true
    
  FULL_ENFORCEMENT:
    description: "Block all violations only after migration complete"
    block_new: true
    block_existing: true
    report_only: false
    ci_integration: true
    migration_complete: true

# Languages to monitor for business logic
business_logic_languages:
  - "python"
  - "typescript" 
  - "javascript"
  - "bash"
  - "yaml"
  - "json"

# Critical areas for migration
critical_areas:
  - "agent-runner workflow logic in Python"
  - "notebooklm enrichment policy in Python"
  - "session lifecycle logic in Python"
  - "content registry policy in YAML"

# Migration paths
migration_paths:
  - "specs/automation/"
  - "specs/policy/"
  - "specs/workflow/"
  - "specs/rules/"
  - "specs/orchestration/"

# CI Gate Configuration
ci_gate:
  enabled: true
  script: "tri t27 audit --baseline specs/architecture/misplaced-logic-inventory.t27"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: false
  baseline_suppression: true
  violation_threshold: 0  # New violations = block; old violations = report

# Status tracking
deployment_status: "ENFORCEMENT_IMPLEMENTED_AUDIT_MODE"
production_ready: false
next_phase: "CI baseline gate + agent-runner migration"
critical_migration_plan: "approved"
violation_count: 198
baseline_date: "2026-10-30"

# Exclusions for existing violations (baseline)
baseline_exclusions:
  - "contrib/backend/agent-runner/agent-runner.py"
  - "contrib/backend/agent-runner/src/agent.rs"
  - "contrib/backend/notebooklm/enrich.py"
  - "contrib/backend/notebooklm/content_registry.yaml"
  - "contrib/backend/notebooklm/wrapup.py"