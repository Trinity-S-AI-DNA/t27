<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px sans-serif; fill: #4a4a6a; }
      .bar { fill: #4a90e2; }
      .bar.t27b { fill: #2ecc71; }
      .label { font: 14px sans-serif; fill: #333; }
      .value { font: bold 14px sans-serif; fill: #1a1a2e; }
      .superiority { font: 12px italic sans-serif; fill: #e67e22; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">T27B Backend Shootout — Gold on All Axes</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Compile time, warm cache, arm64 Mac, median of 3 (log scale)</text>

  <!-- Compile time chart: box y 130..450, uniform 80 px per decade, 1 ms floor at y=450 -->
  <text x="150" y="110" class="label">Compile time (warm, log scale)</text>
  <rect x="100" y="130" width="950" height="320" fill="none" stroke="#ddd" stroke-width="2"/>

  <!-- Y axis decade labels: 1 ms -> 450, then one decade (x10) every 80 px upward -->
  <text x="90" y="455" text-anchor="end" class="label">1ms</text>
  <text x="90" y="375" text-anchor="end" class="label">10ms</text>
  <text x="90" y="295" text-anchor="end" class="label">100ms</text>
  <text x="90" y="215" text-anchor="end" class="label">1s</text>
  <text x="90" y="135" text-anchor="end" class="label">10s</text>

  <!-- Bars: y(v) = 450 - 80*log10(v_ms); positive heights; heights follow the decade grid.
       Sources: docs/blog/2026-10-27-t27b-backend-shootout.md, table "t27b vs C Compilation Performance".
       t27b ~1.0 ms (at the axis floor: 3 px stub), clang -O2 70-110 ms -> 90 ms, gcc -O2 1.49 s,
       zig 0.16 6.7-13.9 s -> 10.3 s, go 0.07-0.16 s -> 115 ms, rustc 0.11-0.14 s -> 125 ms. -->
  <!-- t27b: 1.0 ms, y=450, floor stub -->
  <rect x="150" y="447" width="80" height="3" class="bar t27b"/>
  <text x="190" y="440" text-anchor="middle" class="value">1.0 ms</text>
  <text x="190" y="470" text-anchor="middle" class="label">t27b</text>
  <text x="190" y="487" text-anchor="middle" class="superiority">70-100x faster than clang</text>

  <!-- clang: 90 ms, y = 450 - 80*log10(90) = 293.7 -->
  <rect x="280" y="294" width="80" height="156" class="bar"/>
  <text x="320" y="287" text-anchor="middle" class="value">70-110 ms</text>
  <text x="320" y="470" text-anchor="middle" class="label">clang</text>

  <!-- gcc: 1490 ms, y = 450 - 80*log10(1490) = 196.2 -->
  <rect x="410" y="196" width="80" height="254" class="bar"/>
  <text x="450" y="189" text-anchor="middle" class="value">1.49 s</text>
  <text x="450" y="470" text-anchor="middle" class="label">gcc</text>

  <!-- zig: 10300 ms, y = 450 - 80*log10(10300) = 129.0, clamped to the box top -->
  <rect x="540" y="130" width="80" height="320" class="bar"/>
  <text x="580" y="123" text-anchor="middle" class="value">6.7-13.9 s</text>
  <text x="580" y="470" text-anchor="middle" class="label">zig</text>

  <!-- go: 115 ms, y = 450 - 80*log10(115) = 285.1 -->
  <rect x="670" y="285" width="80" height="165" class="bar"/>
  <text x="710" y="278" text-anchor="middle" class="value">70-160 ms</text>
  <text x="710" y="470" text-anchor="middle" class="label">go</text>

  <!-- rust: 125 ms, y = 450 - 80*log10(125) = 282.2 -->
  <rect x="800" y="282" width="80" height="168" class="bar"/>
  <text x="840" y="275" text-anchor="middle" class="value">110-140 ms</text>
  <text x="840" y="470" text-anchor="middle" class="label">rustc</text>

  <!-- python / javascript: no compile step, no bar -->
  <text x="930" y="440" text-anchor="middle" class="value">N/A</text>
  <text x="930" y="470" text-anchor="middle" class="label">python</text>
  <text x="1060" y="440" text-anchor="middle" class="value">N/A</text>
  <text x="1060" y="470" text-anchor="middle" class="label">js</text>

  <!-- Superiority annotations -->
  <text x="600" y="740" text-anchor="middle" class="superiority">t27b: 70-100x faster compile, 28x smaller artifact, 200x faster than Python</text>
  <text x="600" y="762" text-anchor="middle" class="superiority">Ranges as measured; bar heights use the range midpoint on the log scale.</text>
</svg>
