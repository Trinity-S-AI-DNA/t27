<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px sans-serif; fill: #4a4a6a; }
      .bar { fill: #4a90e2; }
      .bar.t27b { fill: #2ecc71; }
      .label { font: 14px sans-serif; fill: #333; }
      .value { font: bold 14px sans-serif; fill: #1a1a2e; }
      .superiority { font: 12px italic sans-serif; fill: #e67e22; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">T27B Backend Shootout — Gold on All Axes</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Compile time | Size | Runtime | Metaprogramming calls</text>
  
  <!-- Compile time chart -->
  <text x="150" y="110" class="label">Compile time (warm, ms)</text>
  <rect x="100" y="130" width="950" height="320" fill="none" stroke="#ddd" stroke-width="2"/>
  
  <!-- Y axis labels -->
  <text x="90" y="150" text-anchor="end" class="label">10s</text>
  <text x="90" y="230" text-anchor="end" class="label">1s</text>
  <text x="90" y="310" text-anchor="end" class="label">100ms</text>
  <text x="90" y="390" text-anchor="end" class="label">10ms</text>
  <text x="90" y="450" text-anchor="end" class="label">1ms</text>
  
  <!-- Bars: t27b=1ms, clang=90ms, gcc=1490ms, zig=10300ms, go=115ms, rust=125ms, python=N/A, js=N/A -->
  <g transform="translate(100, 450)">
    <!-- t27b -->
    <rect x="50" y="400" width="80" height="-400" class="bar t27b"/>
    <text x="90" y="420" text-anchor="middle" class="value">1.0 ms</text>
    <text x="90" y="445" text-anchor="middle" class="label">t27b</text>
    <text x="90" y="460" text-anchor="middle" class="superiority">70-100x faster than clang</text>
    
    <!-- clang -->
    <rect x="180" y="360" width="80" height="-360" class="bar"/>
    <text x="220" y="380" text-anchor="middle" class="value">90 ms</text>
    <text x="220" y="405" text-anchor="middle" class="label">clang</text>
    
    <!-- gcc -->
    <rect x="310" y="0" width="80" height="-450" class="bar"/>
    <text x="350" y="20" text-anchor="middle" class="value">1490 ms</text>
    <text x="350" y="405" text-anchor="middle" class="label">gcc</text>
    
    <!-- zig -->
    <rect x="440" y="0" width="80" height="-450" class="bar"/>
    <text x="480" y="20" text-anchor="middle" class="value">10300 ms</text>
    <text x="480" y="405" text-anchor="middle" class="label">zig</text>
    
    <!-- go -->
    <rect x="570" y="390" width="80" height="-390" class="bar"/>
    <text x="610" y="410" text-anchor="middle" class="value">115 ms</text>
    <text x="610" y="405" text-anchor="middle" class="label">go</text>
    
    <!-- rust -->
    <rect x="700" y="375" width="80" height="-375" class="bar"/>
    <text x="740" y="395" text-anchor="middle" class="value">125 ms</text>
    <text x="740" y="405" text-anchor="middle" class="label">rust</text>
    
    <!-- python -->
    <rect x="830" y="0" width="80" height="-450" class="bar"/>
    <text x="870" y="20" text-anchor="middle" class="value">N/A</text>
    <text x="870" y="405" text-anchor="middle" class="label">python</text>
    
    <!-- javascript -->
    <rect x="960" y="0" width="80" height="-450" class="bar"/>
    <text x="1000" y="20" text-anchor="middle" class="value">N/A</text>
    <text x="1000" y="405" text-anchor="middle" class="label">js</text>
  </g>
  
  <!-- Superiority annotations -->
  <text x="600" y="740" text-anchor="middle" class="superiority">t27b: 70-100x faster compile, 28x smaller artifact, 200x faster than Python</text>
</svg>
