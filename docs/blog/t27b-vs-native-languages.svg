<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px sans-serif; fill: #4a4a6a; }
      .bar { fill: #9b59b6; }
      .bar.t27b { fill: #2ecc71; }
      .label { font: 14px sans-serif; fill: #333; }
      .value { font: bold 14px sans-serif; fill: #1a1a2e; }
      .superiority { font: 12px italic sans-serif; fill: #e67e22; }
    </style>
  </defs>
  
  <text x="600" y="40" text-anchor="middle" class="title">t27b vs Native Languages — Runtime Performance</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Runtime for 200M calls — t27b vs zig/rust/go/c++/python/javascript</text>
  
  <text x="200" y="110" class="label">Runtime (ms, lower is better)</text>
  <rect x="100" y="130" width="1000" height="320" fill="none" stroke="#ddd" stroke-width="2"/>
  
  <g transform="translate(100, 400)">
    <!-- t27b -->
    <rect x="50" y="360" width="80" height="-360" class="bar t27b"/>
    <text x="90" y="380" text-anchor="middle" class="value">439</text>
    <text x="90" y="405" text-anchor="middle" class="label">t27b</text>
    <text x="90" y="420" text-anchor="middle" class="superiority">within 2.4% of clang</text>
    
    <!-- zig -->
    <rect x="180" y="120" width="80" height="-120" class="bar"/>
    <text x="220" y="140" text-anchor="middle" class="value">150</text>
    <text x="220" y="405" text-anchor="middle" class="label">zig</text>
    
    <!-- rust -->
    <rect x="310" y="112" width="80" height="-112" class="bar"/>
    <text x="350" y="132" text-anchor="middle" class="value">140</text>
    <text x="350" y="405" text-anchor="middle" class="label">rust</text>
    
    <!-- c++ -->
    <rect x="440" y="344" width="80" height="-344" class="bar"/>
    <text x="480" y="364" text-anchor="middle" class="value">430</text>
    <text x="480" y="405" text-anchor="middle" class="label">c++</text>
    
    <!-- go -->
    <rect x="570" y="664" width="80" height="-264" class="bar"/>
    <text x="610" y="684" text-anchor="middle" class="value">830</text>
    <text x="610" y="405" text-anchor="middle" class="label">go</text>
    
    <!-- python -->
    <rect x="700" y="0" width="80" height="-400" class="bar"/>
    <text x="740" y="10" text-anchor="middle" class="value">90500</text>
    <text x="740" y="405" text-anchor="middle" class="label">python</text>
    
    <!-- javascript -->
    <rect x="830" y="96" width="80" height="-96" class="bar"/>
    <text x="870" y="116" text-anchor="middle" class="value">120</text>
    <text x="870" y="405" text-anchor="middle" class="label">js</text>
  </g>
  
  <text x="600" y="740" text-anchor="middle" class="superiority">t27b: 200x faster than Python, comparable runtime to C, 28x smaller artifact than JS</text>
</svg>
