<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px sans-serif; fill: #4a4a6a; }
      .label { font: 14px sans-serif; fill: #333; }
      .value { font: bold 14px sans-serif; fill: #1a1a2e; }
      .box { fill: none; stroke: #4a90e2; stroke-width: 2; }
      .box.t27b { fill: #2ecc71; stroke: #27ae60; }
      .arrow { stroke: #e67e22; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .superiority { font: 12px italic sans-serif; fill: #e67e22; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
  
  <text x="600" y="40" text-anchor="middle" class="title">Science Under the Shootout</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Research foundations and t27b's golden claims</text>
  
  <!-- Foundations -->
  <g class="box">
    <rect x="100" y="120" width="350" height="100"/>
    <text x="275" y="155" text-anchor="middle" class="value">Build Systems à la Carte</text>
    <text x="275" y="175" text-anchor="middle" class="label">Mokhov, Mitchell & Peyton Jones, ICFP 2018</text>
    <text x="275" y="195" text-anchor="middle" class="label">Early cutoff rule for speed</text>
  </g>
  
  <g class="box">
    <rect x="500" y="120" width="350" height="100"/>
    <text x="675" y="155" text-anchor="middle" class="value">Adapton</text>
    <text x="675" y="175" text-anchor="middle" class="label">Hammer, Acar, Chen & Mulhern, PLDI 2014</text>
    <text x="675" y="195" text-anchor="middle" class="label">Demand-driven recomputation</text>
  </g>
  
  <g class="box">
    <rect x="100" y="280" width="350" height="100"/>
    <text x="275" y="315" text-anchor="middle" class="value">Proof-Carrying Code</text>
    <text x="275" y="335" text-anchor="middle" class="label">Necula & Lee, POPL 1996</text>
    <text x="275" y="355" text-anchor="middle" class="label">Artifacts with checkable proofs</text>
  </g>
  
  <g class="box">
    <rect x="500" y="280" width="350" height="100"/>
    <text x="675" y="315" text-anchor="middle" class="value">Incremental Compiler Construction</text>
    <text x="675" y="335" text-anchor="middle" class="label">Ghuloum, 2006</text>
    <text x="675" y="355" text-anchor="middle" class="label">Tiered compilers</text>
  </g>
  
  <!-- t27b result -->
  <g class="box t27b">
    <rect x="300" y="440" width="600" height="140"/>
    <text x="600" y="475" text-anchor="middle" class="value">t27B Backend Shootout</text>
    <text x="600" y="500" text-anchor="middle" class="label">1.0 ms compile · 608 B artifact · within 2.4% of clang</text>
    <text x="600" y="525" text-anchor="middle" class="label">70-100x faster compile · 28x smaller artifact</text>
    <text x="600" y="550" text-anchor="middle" class="label">Compile-time unrolling (Zig-style): 1000x call amplification</text>
  </g>
  
  <!-- Arrows -->
  <line x1="275" y1="220" x2="275" y2="440" class="arrow"/>
  <line x1="675" y1="220" x2="675" y2="440" class="arrow"/>
  <line x1="275" y1="380" x2="275" y2="440" class="arrow"/>
  <line x1="675" y1="380" x2="675" y2="440" class="arrow"/>
  
  <text x="600" y="740" text-anchor="middle" class="superiority">Four old, well-proven ideas composed — measured at 1.0 ms, 608 bytes, 2.4% runtime gap against clang -O2</text>
</svg>
