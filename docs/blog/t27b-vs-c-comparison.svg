<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a2e; }
      .subtitle { font: 16px sans-serif; fill: #4a4a6a; }
      .bar { fill: #3498db; }
      .bar.t27b { fill: #2ecc71; }
      .label { font: 14px sans-serif; fill: #333; }
      .value { font: bold 14px sans-serif; fill: #1a1a2e; }
      .superiority { font: 12px italic sans-serif; fill: #e67e22; }
    </style>
  </defs>
  
  <text x="600" y="40" text-anchor="middle" class="title">t27b vs C — Compilation &amp; Size</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">t27b vs clang/gcc/c++ — compile time, artifact size, superiority</text>
  
  <!-- Compile time -->
  <text x="200" y="110" class="label">Compile time (warm, ms)</text>
  <rect x="100" y="130" width="500" height="320" fill="none" stroke="#ddd" stroke-width="2"/>
  
  <g transform="translate(100, 400)">
    <!-- t27b -->
    <rect x="40" y="390" width="70" height="-390" class="bar t27b"/>
    <text x="75" y="410" text-anchor="middle" class="value">1.0</text>
    <text x="75" y="435" text-anchor="middle" class="label">t27b</text>
    
    <!-- clang -->
    <rect x="150" y="310" width="70" height="-310" class="bar"/>
    <text x="185" y="330" text-anchor="middle" class="value">90</text>
    <text x="185" y="435" text-anchor="middle" class="label">clang</text>
    
    <!-- gcc -->
    <rect x="260" y="0" width="70" height="-400" class="bar"/>
    <text x="295" y="10" text-anchor="middle" class="value">1490</text>
    <text x="295" y="435" text-anchor="middle" class="label">gcc</text>
    
    <!-- c++ -->
    <rect x="370" y="0" width="70" height="-400" class="bar"/>
    <text x="405" y="10" text-anchor="middle" class="value">350</text>
    <text x="405" y="435" text-anchor="middle" class="label">c++</text>
  </g>
  
  <!-- Size -->
  <text x="750" y="110" class="label">Artifact size (bytes)</text>
  <rect x="650" y="130" width="500" height="320" fill="none" stroke="#ddd" stroke-width="2"/>
  
  <g transform="translate(650, 400)">
    <!-- t27b -->
    <rect x="40" y="395" width="70" height="-395" class="bar t27b"/>
    <text x="75" y="415" text-anchor="middle" class="value">608</text>
    <text x="75" y="440" text-anchor="middle" class="label">t27b</text>
    
    <!-- clang -->
    <rect x="150" y="0" width="70" height="-400" class="bar"/>
    <text x="185" y="10" text-anchor="middle" class="value">17016</text>
    <text x="185" y="440" text-anchor="middle" class="label">clang</text>
    
    <!-- gcc -->
    <rect x="260" y="0" width="70" height="-400" class="bar"/>
    <text x="295" y="10" text-anchor="middle" class="value">17000</text>
    <text x="295" y="440" text-anchor="middle" class="label">gcc</text>
    
    <!-- c++ -->
    <rect x="370" y="0" width="70" height="-400" class="bar"/>
    <text x="405" y="10" text-anchor="middle" class="value">18000</text>
    <text x="405" y="440" text-anchor="middle" class="label">c++</text>
  </g>
  
  <!-- Superiority -->
  <text x="600" y="740" text-anchor="middle" class="superiority">t27b: 70-100x faster compile than clang, 28x smaller artifact than C binaries</text>
</svg>
