name: Queen Publish (bee branches)

# The step nobody was taking.
#
# Measured 2026-09-20: 401 `queen-*` branches on the remote and the last bee
# pull request opened on 2026-09-17. Of the forty most recent branches, 24 carry
# real commits, 9 carry only a salvage commit, 7 are empty - and every one of
# the 24 was invisible, because nothing in this system opens a pull request. The
# Queen skips issues that ARE pull requests and never creates one; the container
# holds no push credential by design; the job that used to do it was somebody
# running a script on a laptop.
#
# So twenty bees ran at ninety percent utilisation for three days and shipped
# nothing, while every instrument reported a healthy swarm - because every
# instrument was measuring dispatch, not delivery.
#
# This publishes at most a handful per run. Not a throttle for its own sake:
# every pull request starts twenty-odd workflow runs, and this repository has
# already had a CI queue of 1073 superseded runs starve its own gates.
#
# No `paths:` filter, for the reason spelled out in verilog-widths.yml.

on:
  # A bee branch arriving is the moment there is something to publish, and a
  # push is an event GitHub delivers - unlike the schedule below, which it
  # throttled to four runs in twenty-four hours on 2026-09-21 (#4598). The
  # schedule stays as the backstop for anything a missed event leaves behind.
  # The publisher's own docs/now commit re-triggers this once; that run finds
  # the pull request already open and does nothing, and the concurrency group
  # below collapses a burst of pushes into one waiting run.
  push:
    branches:
      - 'queen-*'
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum branches to publish in this run'
        required: false
        default: '10'
      dry_run:
        description: 'Measure and print, publish nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: queen-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure the publisher's identity
        run: |
          git config user.name "queen-publisher[bot]"
          git config user.email "noreply@anthropic.com"

      # The refusals first, against branch names and bodies whose verdict is
      # known - including two names this must NOT take. A publisher that cannot
      # be shown to refuse is one nobody should let near 401 branches.
      - name: The refusals, against fixtures
        run: python3 tools/queen/publish.py --self-test

      # NOT `github.token`. Measured on the first scheduled run, 2026-09-20:
      #
      #   gh pr create failed: GraphQL: GitHub Actions is not permitted to
      #   create or approve pull requests (createPullRequest)
      #
      # The repository has `can_approve_pull_request_reviews: false`, which is
      # the same switch, and turning it on would let EVERY workflow in the
      # repository open a pull request. A named token for the one job that
      # needs it is the smaller grant. `GH_AGENT_TOKEN` already exists as a
      # secret; falling back to `github.token` keeps the job runnable in a fork
      # or a clone that has no such secret - it will refuse the same way, in
      # its own words, rather than failing to start.
      - name: Publish what the bees already pushed
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN || github.token }}
        run: |
          python3 tools/queen/publish.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            --limit ${{ (github.event_name == 'workflow_dispatch' && inputs.limit) || 10 }}

      # Handle seal refresh and ledger steward verdicts
      - name: Check for seal refresh and ledger steward verdicts
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN || github.token }}
        run: |
          # Check for seal refresh verdicts (/seals/<sha>.json with verdict "REFRESH")
          python3 << 'EOF'
          import os
          import json
          import re
          import subprocess
          import sys
          
          def sh(args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()
          
          def get_master_tip():
              return sh(["git", "rev-parse", "origin/master"])
          
          master_sha = get_master_tip()
          master_short = master_sha[:12]
          
          # Check for seal refresh verdict file
          seal_verdict_path = f"seals/{master_short}.json"
          if os.path.exists(seal_verdict_path):
              with open(seal_verdict_path, 'r') as f:
                  seal_verdict = json.load(f)
              if seal_verdict.get("verdict") == "REFRESH":
                  # Check if this is a seal refresh (touches only .trinity/seals/)
                  diff = sh(["git", "diff", "--name-only", f"origin/master...HEAD"])
                  seal_files = [f for f in diff.split('\n') if f.startswith(".trinity/seals/")]
                  
                  if len(seal_files) > 0 and all(f.startswith(".trinity/seals/") for f in seal_files):
                      branch_name = f"bot/seals-{master_short}"
                      print(f"Seal refresh needed for {master_short}")
                      print(f"Branch: {branch_name}")
                      print(f"Files: {len(seal_files)} seal files")
                      
                      # Check if branch already exists
                      existing_branches = sh(["git", "branch", "-r"])
                      if branch_name not in existing_branches:
                          # Create and push branch
                          sh(["git", "checkout", "-b", branch_name])
                          sh(["git", "push", "-u", "origin", branch_name])
                          
                          # Create issue
                          issue_title = f"Seal refresh for {master_short}"
                          issue_body = f"""Seal refresh for commit {master_short}

This PR refreshes the following seal files:
- {chr(10).join(f'- {f}' for f in seal_files)}

The seal refresh verdict was triggered by gen-drift in the seal coverage check.

Closes #9092

Auto-generated by queen-publish.yml"""
                          
                          # Create issue
                          issue_cmd = ["gh", "issue", "create", "--title", issue_title, "--body", issue_body]
                          issue_output = sh(issue_cmd)
                          issue_number = issue_output.split()[-1]
                          
                          # Create PR
                          pr_body = f"""Closes #{issue_number}

Seal refresh for {master_short}

This PR updates the following seal files that were flagged for refresh:
- {chr(10).join(f'- {f}' for f in seal_files)}

The refresh was triggered by detected gen-drift in the seal coverage check.

Auto-generated by queen-publish.yml"""
                          
                          pr_cmd = ["gh", "pr", "create", "--base", "master", "--head", branch_name, 
                                   "--title", f"Seal refresh for {master_short}", "--body", pr_body]
                          sh(pr_cmd)
                          print(f"Created seal refresh PR: {branch_name}")
                      else:
                          print(f"Branch {branch_name} already exists, skipping")
          
          # Check for ledger steward verdict file
          ledger_verdict_path = f"ledger/{master_short}.json"
          if os.path.exists(ledger_verdict_path):
              with open(ledger_verdict_path, 'r') as f:
                  ledger_verdict = json.load(f)
              
              verdict = ledger_verdict.get("verdict")
              if verdict == "APPLY":
                  # Check if this is a ledger steward update (touches only docs/reports/t27b_expectations.json)
                  diff = sh(["git", "diff", "--name-only", f"origin/master...HEAD"])
                  ledger_files = [f for f in diff.split('\n') if f == "docs/reports/t27b_expectations.json"]
                  
                  if len(ledger_files) > 0:
                      branch_name = f"steward/t27b-ledger-{master_short}"
                      print(f"Ledger steward APPLY needed for {master_short}")
                      print(f"Branch: {branch_name}")
                      print(f"Files: {len(ledger_files)} ledger file")
                      
                      # Check if branch already exists
                      existing_branches = sh(["git", "branch", "-r"])
                      if branch_name not in existing_branches:
                          # Create and push branch
                          sh(["git", "checkout", "-b", branch_name])
                          sh(["git", "push", "-u", "origin", branch_name])
                          
                          # Create issue with t27b-ledger-steward label
                          issue_title = f"Ledger steward update for {master_short}"
                          issue_body = f"""Ledger steward update for commit {master_short}

This PR updates the t27b expectations file.

The ledger steward verdict was APPLY for this commit.

Closes #9092

Auto-generated by queen-publish.yml"""
                          
                          # Create issue with label
                          issue_cmd = ["gh", "issue", "create", "--title", issue_title, "--body", issue_body,
                                     "--label", "t27b-ledger-steward"]
                          issue_output = sh(issue_cmd)
                          issue_number = issue_output.split()[-1]
                          
                          # Create PR
                          pr_body = f"""Closes #{issue_number}

Ledger steward update for {master_short}

This PR updates the t27b expectations file that was flagged for update by the ledger steward.

Auto-generated by queen-publish.yml"""
                          
                          pr_cmd = ["gh", "pr", "create", "--base", "master", "--head", branch_name,
                                   "--title", f"Ledger steward update for {master_short}", "--body", pr_body]
                          sh(pr_cmd)
                          print(f"Created ledger steward PR: {branch_name}")
                      else:
                          print(f"Branch {branch_name} already exists, skipping")
              
              elif verdict == "REFUSE":
                  # Create refusal issue
                  issue_title = f"Ledger steward refusal for {master_short}"
                  issue_body = f"""Ledger steward refusal for commit {master_short}

The ledger steward verdict was REFUSE for this commit. No PR will be created.

Run details:
- Commit: {master_short}
- Verdict: REFUSE
- Reason: The ledger steward determined that the changes should not be applied

This is an informational issue to track the refusal decision.

Closes #9092

Auto-generated by queen-publish.yml"""
                  
                  # Create issue
                  issue_cmd = ["gh", "issue", "create", "--title", issue_title, "--body", issue_body]
                  sh(issue_cmd)
                  print(f"Created ledger refusal issue for {master_short}")
          
          print("Seal refresh and ledger steward check completed")
          EOF
