name: Queen Publish (bee branches)

# The step nobody was taking.
#
# Measured 2026-09-20: 401 `queen-*` branches on the remote and the last bee
# pull request opened on 2026-09-17. Of the forty most recent branches, 24 carry
# real commits, 9 carry only a salvage commit, 7 are empty - and every one of
# the 24 was invisible, because nothing in this system opens a pull request. The
# Queen skips issues that ARE pull requests and never creates one; the container
# holds no push credential by design; the job that used to do it was somebody
# running a script on a laptop.
#
# So twenty bees ran at ninety percent utilisation for three days and shipped
# nothing, while every instrument reported a healthy swarm - because every
# instrument was measuring dispatch, not delivery.
#
# This publishes at most a handful per run. Not a throttle for its own sake:
# every pull request starts twenty-odd workflow runs, and this repository has
# already had a CI queue of 1073 superseded runs starve its own gates.
#
# No `paths:` filter, for the reason spelled out in verilog-widths.yml.

on:
  # A bee branch arriving is the moment there is something to publish, and a
  # push is an event GitHub delivers - unlike the schedule below, which it
  # throttled to four runs in twenty-four hours on 2026-09-21 (#4598). The
  # schedule stays as the backstop for anything a missed event leaves behind.
  # The publisher's own docs/now commit re-triggers this once; that run finds
  # the pull request already open and does nothing, and the concurrency group
  # below collapses a burst of pushes into one waiting run.
  push:
    branches:
      - 'queen-*'
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum branches to publish in this run'
        required: false
        default: '10'
      dry_run:
        description: 'Measure and print, publish nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: queen-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure the publisher's identity
        run: |
          git config user.name "queen-publisher[bot]"
          git config user.email "noreply@anthropic.com"

      # The refusals first, against branch names and bodies whose verdict is
      # known - including two names this must NOT take. A publisher that cannot
      # be shown to refuse is one nobody should let near 401 branches.
      - name: The refusals, against fixtures
        run: python3 tools/queen/publish.py --self-test

      # NOT `github.token`. Measured on the first scheduled run, 2026-09-20:
      #
      #   gh pr create failed: GraphQL: GitHub Actions is not permitted to
      #   create or approve pull requests (createPullRequest)
      #
      # The repository has `can_approve_pull_request_reviews: false`, which is
      # the same switch, and turning it on would let EVERY workflow in the
      # repository open a pull request. A named token for the one job that
      # needs it is the smaller grant. `GH_AGENT_TOKEN` already exists as a
      # secret; falling back to `github.token` keeps the job runnable in a fork
      # or a clone that has no such secret - it will refuse the same way, in
      # its own words, rather than failing to start.
      - name: Publish what the bees already pushed
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN || github.token }}
        run: |
          python3 tools/queen/publish.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            --limit ${{ (github.event_name == 'workflow_dispatch' && inputs.limit) || 10 }}

  # Derived records (#9092). The labs hold no credential: for a master commit, t27c-lab publishes the seal
  # refresh (#9080, specs/ci/derived_data.t27) and t27b-lab the ledger steward's run (#9091, card
  # specs/jobs/t27b_ledger_steward.t27 steps 1 and 3-6). This opens what a verdict allows: one issue, branch
  # and PR per kind and commit, auto-merge while checks are pending. brain-seal-refresh.yml never could.
  derived-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { ref: master, fetch-depth: 0, token: "${{ secrets.GH_AGENT_TOKEN || github.token }}" }
      - name: Open the PR each lab verdict allows, or the refusals issue
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN || github.token }}
        run: |
          tip=$(git rev-parse HEAD); d=$(mktemp -d); c=https://t27c-lab-production.up.railway.app; b=https://t27b-lab-production.up.railway.app
          for k in "seals $(curl -fsS $c/latest.json | jq -r .heads.master.sha) $c/seals .trinity/seals/ REFRESH bot/seals- -" \
                   "ledger $(curl -fsS $b/latest.json | jq -r .commit) $b/ledger docs/reports/t27b_expectations.json APPLY steward/t27b-ledger- t27b-ledger-steward"; do
            set -- $k; s=$2; br=$6${2:0:12}; lab=$([ "$7" = - ] || echo "-l $7"); git checkout -qf --detach "$tip"
            git merge-base --is-ancestor "$s" "$tip" && curl -fsS "$3/$s.json" -o $d/v.json || { echo "$1: no lab verdict for a master commit ($s)"; continue; }
            v=$(jq -r .verdict $d/v.json); [ "$v" = REFUSE ] || [ "$v" = "$5" ] || { echo "$1: lab verdict $v at ${s:0:12}"; continue; }
            n=$(gh issue list -S "${s:0:12} in:title" -s all --json number,title -q "map(select(.title | startswith(\"$1:\")))[0].number // empty")
            git ls-remote --exit-code origin "refs/heads/$br" >/dev/null && { echo "$1: $br exists"; continue; }
            rows=$(jq -r '(.findings // .seals)[] | "| \(.kind // .gate) | `\(.path // .seal)` | \(.t27b // .spec) | \(.action // .verdict) | \(.refusal_reason // .saved) |"' $d/v.json)
            if [ "$v" = REFUSE ] && [ -z "$n" ]; then  # card step 1: one issue for the run and no PR; reasons are ledger_steward.t27's RR_* codes
              printf 'The ledger steward refuses master %s: %s/%s.json (run_refusal %s).\n\n| finding | spec | t27b | action | refusal_reason |\n|---|---|---|---|---|\n%s\n' \
                "$s" "$3" "$s" "$(jq -r .run_refusal $d/v.json)" "$rows" | gh issue create -t "$1: the steward refuses master ${s:0:12}" $lab -F -; continue; fi
            [ "$v" = "$5" ] && curl -fsS "$3/$s.patch" -o $d/p.patch || { echo "$1: lab verdict $v at ${s:0:12}"; continue; }
            git apply --numstat $d/p.patch | cut -f3 | grep -qv "^$4" && { echo "::error::$1: the patch of ${s:0:12} leaves $4"; continue; }
            git apply --check $d/p.patch || { echo "$1: the patch of ${s:0:12} does not apply to ${tip:0:12}"; continue; }
            t="$1: re-derive from master ${s:0:12}, as its lab verdict $v says"; body="From $3/$s.patch, applied unchanged; verdict $3/$s.json (see #9092)."
            [ -n "$n" ] || n=$(printf '%s\n\n| finding | file | t27b or spec | verdict | refusal or saved |\n|---|---|---|---|---|\n%s\n' "$body" "$rows" | gh issue create -t "$t" $lab -F - | grep -o '[0-9]*$')
            git switch -qC "$br" && git apply --index $d/p.patch && git -c user.name="queen-publisher[bot]" -c user.email=noreply@anthropic.com commit -qm "$t (Closes #$n)" && git push -q origin "$br" || continue
            printf 'Closes #%s\n\n%s\n\n| finding | file | t27b or spec | verdict | refusal or saved |\n|---|---|---|---|---|\n%s\n' "$n" "$body" "$rows" | gh pr create -H "$br" -t "$t (Closes #$n)" -F - && gh pr merge "$br" --auto --squash
            gh pr list -s open -L 200 --json number,headRefName -q ".[] | select(.headRefName | startswith(\"$6\")) | select(.headRefName != \"$br\") | .number" |
              xargs -rn1 gh pr close -c "Superseded by $br, from a newer master (derived_data.t27 bot_pr_action: B_REGENERATE)"
          done
