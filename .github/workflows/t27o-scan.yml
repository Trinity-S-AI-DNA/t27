name: t27o Scan

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2 AM UTC
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to scan (t27, trinity, trios, BrowserOS, 999-multibots-telegraf, ghashtag.github.io)'
        required: true
        default: 't27'
        type: choice
        options:
          - t27
          - trinity
          - trios
          - BrowserOS
          - 999-multibots-telegraf
          - ghashtag.github.io

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml
      
      - name: Run t27o scan
        run: |
          python3 tools/t27o-scan.py . --output scan-results.json --report scan-report.md
      
      - name: Process scan results
        id: process-results
        run: |
          # Parse JSON results
          python3 << 'EOF'
          import json
          
          with open('scan-results.json', 'r') as f:
              results = json.load(f)
          
          # Calculate percentages
          total = results.get('total_functions', 0)
          convertible = results.get('convertible_functions', 0)
          verifiable = results.get('verifiable_functions', 0)
          
          if total > 0:
              convertible_pct = (convertible / total) * 100
              verifiable_pct = (verifiable / total) * 100
          else:
              convertible_pct = 0
              verifiable_pct = 0
          
          # Set output variables
          print(f"convertible_pct={convertible_pct:.1f}")
          print(f"verifiable_pct={verifiable_pct:.1f}")
          print(f"total_functions={total}")
          print(f"convertible_functions={convertible}")
          print(f"verifiable_functions={verifiable}")
          print(f"repository=${{ github.event.inputs.repository || 't27' }}")
          EOF
      
      - name: Create scan report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('scan-report.md', 'utf8');
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));
            
            const repo = context.event.inputs?.repository || 't27';
            const convertiblePct = parseFloat(context.steps.process-results.outputs.convertible_pct);
            const verifiablePct = parseFloat(context.steps.process-results.outputs.verifiable_pct);
            
            const issueBody = `# t27o Scan Report - ${repo} - ${new Date().toISOString().split('T')[0]}

## Summary
- Repository: ${repo}
- Total Functions: ${context.steps.process-results.outputs.total_functions}
- Convertible Functions: ${context.steps.process-results.outputs.convertible_functions} (${convertiblePct.toFixed(1)}%)
- Verifiable Functions: ${context.steps.process-results.outputs.verifiable_functions} (${verifiablePct.toFixed(1)}%)

## Language Breakdown

${Object.entries(results.language_stats || {}).map(([lang, stats]) => 
  `### ${lang.toUpperCase()}
- Total: ${stats.total}
- Convertible: ${stats.convertible} (${((stats.convertible / stats.total) * 100).toFixed(1)}%)
- Verifiable: ${stats.verifiable} (${((stats.verifiable / stats.total) * 100).toFixed(1)}%)`
).join('\n\n')}

## Top Refusal Reasons

${Object.entries(results.refusal_reasons || {}).map(([reason, count]) => 
  `- ${reason}: ${count}`
).join('\n')}

## Detailed Results

${report}

---

*This issue was automatically generated by the t27o scan workflow.*
`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `t27o Scan Report - ${repo} - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['t27o-scan', 'quality-gates', 'automated']
            });
      
      - name: Update README with scan statistics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update t27o scan statistics'
          file_pattern: 'README.md'
          commit_user_name: 't27o-scan-bot'
          commit_user_email: 't27o-scan-bot@example.com'
          commit_author: 't27o-scan-bot <t27o-scan-bot@example.com>'
          files: |
            README.md