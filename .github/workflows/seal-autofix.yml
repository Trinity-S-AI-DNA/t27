# Seal Autofix -- a pull request that changes a spec carries its seal in the
# same push, so parse-ratchet never blocks on a stale seal again (the class
# that ate four PRs on 2026-10-26). Machinery GitHub parses, t27 does not; the
# owner's standing approval covers the workflow as CI plumbing (2026-10-25,
# issue #12170).
name: Seal Autofix

on:
  pull_request:
    paths:
      - "specs/**/*.t27"

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    # never on the bot's own pushes: the autofix commit touches .trinity/seals
    # only, so the paths filter above does not re-fire -- this guard is belt.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install zig
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version
      - name: Build t27c
        run: cd bootstrap && cargo build --release --bin t27c
      - name: Re-seal the specs this PR changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha }}"
          T27C="$PWD/bootstrap/target/release/t27c"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'specs/*.t27' 'specs/**/*.t27' || true)
          if [ -z "$CHANGED" ]; then
            echo "no spec changes"; exit 0
          fi
          did=0
          for S in $CHANGED; do
            # only specs that already carry a seal: the ratchet asks the seal to
            # move WITH the spec; brand-new specs are sealed by their authors
            if grep -rlq "\"$S\"" .trinity/seals/ 2>/dev/null; then
              echo "resealing $S"
              "$T27C" seal --save "$S" && did=1
            else
              echo "no existing seal for $S -- authors seal new specs"
            fi
          done
          if [ "$did" != "1" ] || git diff --quiet .trinity/seals/; then
            echo "nothing to refresh"; exit 0
          fi
          git config user.name "seal-autofix"
          git config user.email "autofix@t27.ai"
          git add .trinity/seals
          git commit -qm "seals: auto-refresh for the specs this PR changed (Closes #$PR)"
          git push -q origin HEAD:"refs/heads/${{ github.event.pull_request.head.ref }}"
          echo "pushed refreshed seals to the PR branch"
