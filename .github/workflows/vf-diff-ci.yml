name: vf-diff CI
on:
  pull_request:
  push: {branches: [master]}
  workflow_dispatch:
concurrency:
  group: vf-diff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vf-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - {name: Install zig 0.16.0, run: 'curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C "$RUNNER_TEMP" && echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"'}
      - name: Build t27b and generate vf_diff_main
        run: |
          cargo build --release -p t27b
          ./target/release/t27b build specs/t27os/vf_diff_main.t27
      - name: Run pixel-diff checks
        run: |
          frame=runs/m0/m0_card_v1.ppm
          printf 'P6\n1 1\n255\n\377\000\000' > /tmp/fa.ppm
          printf 'P6\n1 1\n255\n\000\377\000' > /tmp/fb.ppm
          DIFF_A=$frame DIFF_B=$frame DIFF_OUT=target/zero.ppm ./vf_diff 2>&1 | tee counts.txt
          DIFF_A=/tmp/fa.ppm DIFF_B=/tmp/fb.ppm DIFF_OUT=target/nonzero.ppm ./vf_diff 2>&1 | tee -a counts.txt
      - name: Upload diff-count artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-diff-counts
          path: counts.txt
