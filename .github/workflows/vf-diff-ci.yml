name: vf-diff CI
on:
  pull_request:
  push: {branches: [master]}
  workflow_dispatch:
concurrency:
  group: vf-diff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vf-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - {name: Install cross toolchain, run: 'sudo apt-get install -y -q qemu-user gcc-aarch64-linux-gnu'}
      - name: Build t27b and compile vf_diff
        run: |
          cargo build --release -p t27b
          ./target/release/t27b build specs/t27os/vf_diff_main.t27 -o vf_diff.o --elf
          aarch64-linux-gnu-gcc vf_diff.o -o vf_diff
      - name: Run pixel-diff checks
        run: |
          frame=runs/m0/m0_card_v1.ppm
          printf 'P6\n1 1\n255\n\377\000\000' > /tmp/fa.ppm
          printf 'P6\n1 1\n255\n\000\377\000' > /tmp/fb.ppm
          DIFF_A=$frame DIFF_B=$frame DIFF_OUT=target/zero.ppm qemu-aarch64 -L /usr/aarch64-linux-gnu ./vf_diff 2>&1 | tee counts.txt
          DIFF_A=/tmp/fa.ppm DIFF_B=/tmp/fb.ppm DIFF_OUT=target/nonzero.ppm qemu-aarch64 -L /usr/aarch64-linux-gnu ./vf_diff 2>&1 | tee -a counts.txt
      - name: Upload diff-count artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-diff-counts
          path: counts.txt
