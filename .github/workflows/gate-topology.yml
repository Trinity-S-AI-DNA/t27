name: Gate Topology

# Checks the gates themselves rather than the code they guard.
#
# A gate with `branches: [master]` under `pull_request` does not run when a PR
# targets any other base. On a stacked PR every such gate is absent and
# `gh pr checks` prints a green list -- the green of a gate that never fired.
# Observed in this repository on 2026-08-15 on three gates at once.
#
# This workflow deliberately carries NO `branches:` filter, since a branch filter
# here would reproduce exactly the defect it exists to detect.

on:
  pull_request:
  push:
    branches: [master]
  # Without this the missing reading cannot be taken on purpose: a gate with
  # a `paths:` filter that nothing has matched in months is unmeasured, not
  # passing, and there was no way to fire it at the default branch and find
  # out. `tri gates unmeasured` reports the gap; this is what closes it.
  workflow_dispatch:
    inputs: {prs: {description: "claw-batch only: N:headsha pairs of specs/port pull requests to fold into one batch", required: false, default: "", type: string}}
  # Only the claw-t27f job below runs on this schedule (#10268).
  schedule: [{cron: "*/10 * * * *"}]

# A run for a commit that has since been superseded measures nothing anyone
# will read. Without a group, every merge to master queued one more run of
# this gate behind the last: 62 were waiting on 2026-09-17 while the 15
# workflows that do carry a group had exactly one each.
concurrency:
  group: gate-topology-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-topology:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Merge-critical workflows must not filter pull_request by branch
        run: |
          python3 scripts/ci/check_pr_branch_filters.py --self-test
          python3 scripts/ci/check_pr_branch_filters.py

      # A gate that does not fire is one way to get a green that means nothing;
      # a gate that fires and describes itself as deeper than it is, is another.
      # fpga-lint runs read_verilog + hierarchy and reported 32/32 on an artifact
      # iverilog compiles 4/32 (#2326). Its reach is a policy question and is
      # left alone. Its self-description is held here.
      #
      # The self-test runs first and on its own line: it asserts this checker
      # rejects the five shapes it exists to reject, including the verbatim
      # pre-change shape of fpga-build.yml. A claim gate nobody has watched fail
      # is indistinguishable from one that cannot.
      - name: fpga-lint claim gate is falsifiable (self-test)
        run: python3 scripts/ci/check_fpga_lint_claim_matches_depth.py --self-test

      - name: fpga-lint must state the depth it measures
        run: python3 scripts/ci/check_fpga_lint_claim_matches_depth.py

      # TRI CLAW drift gate (epic #9271, T2): the gate inventory in
      # specs/claw/gates.t27 and .github/workflows must agree in the same
      # commit -- a workflow file cannot land without its row here, and a row
      # cannot outlive its file. The law is claw_status in the spec; t27c
      # gen-c lowers it into gen/c/claw/gates.c, and the printf'd harness
      # below is machinery only (the committed pattern of spec-guards.yml):
      # feed `ls`, relay the report, exit 0 clean / 1 drift, per
      # specs/claw/service.t27.
      - name: Gate inventory must match the workflows directory (claw drift)
        run: |
          d="$(mktemp -d)"
          printf '#include <stdio.h>\n#include <string.h>\n#include "gen/c/claw/gates.c"\nint main(void){static unsigned char dir[65536],out[65536];size_t n=fread(dir,1,sizeof dir,stdin);int p=claw_status(dir,n,out,sizeof out);fwrite(out,1,strlen((const char*)out),stdout);return p>0?1:0;}\n' \
            | cc -w -I . -x c -o "$d/claw-audit" -
          (cd .github/workflows && ls *.yml | sed 's/\.yml$//') | "$d/claw-audit"

  # claw/t27f (#10268): one seal-gated T27F check-run per open .t27 pull request in every repository
  # the TRI CLAW App is installed on. The law is specs/claw/t27f_gate.t27 (gen/c/claw/t27f_gate.c); this
  # job only mints the App token, fetches, runs the signed t27o release t27c and posts what the law prints.
  claw-t27f:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - id: have
        env: {K: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", I: "${{ vars.CLAW_APP_ID }}"}
        run: if [ -n "$K" ] && [ -n "$I" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "claw/t27f posted nothing - secret CLAW_APP_PRIVATE_KEY or variable CLAW_APP_ID is not set (docs/claw/README.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - {id: tok, if: steps.have.outputs.ok, continue-on-error: true, uses: actions/create-github-app-token@v2, with: {app-id: "${{ vars.CLAW_APP_ID }}", private-key: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", owner: gHashTag, permission-checks: write, permission-pull-requests: read, permission-contents: read}}
      - {if: steps.tok.outcome == 'failure', run: echo "claw/t27f posted nothing - the TRI CLAW App could not mint a token with checks write; grant it and accept it on the installation - docs/claw/README.md steps 1-2." >> "$GITHUB_STEP_SUMMARY"}
      - {if: steps.tok.outputs.token, uses: actions/checkout@v6}
      - {if: steps.tok.outputs.token, uses: sigstore/cosign-installer@v3}
      - if: steps.tok.outputs.token
        env: {GH_TOKEN: "${{ steps.tok.outputs.token }}", V: t27o-v0.1.0}
        shell: bash {0}
        run: |
          set -e; cd /tmp; B=https://github.com/gHashTag/t27/releases/download/$V
          for f in t27c checksums-$V.txt; do curl -fsSLo $f $B/$f; curl -fsSLo $f.sigstore.json $B/$f.sigstore.json
            cosign verify-blob $f --bundle $f.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "^https://github.com/gHashTag/t27/.github/workflows/t27o-release.yml@refs/tags/$V$"; done
          sha256sum -c --ignore-missing checksums-$V.txt; chmod +x t27c; T=/tmp/t27c
          printf '#include "%s/gen/c/claw/t27f_gate.c"\n#include <stdio.h>\n#include <stdlib.h>\nint main(int c,char**v){size_t k=1<<24,m;uint8_t*b=malloc(k),*o=malloc(k);size_t n=fread(b,1,k,stdin);if(n==k)return 2;\nif(c>1&&*v[1]==97)m=t27f_annotations(b,n,o,k);else if(c>1){m=t27f_scope(b,n,o,k);if(m>k)return 3;}else m=t27f_report(b,n,o,65000);fwrite(o,1,m,stdout);return 0;}\n' "$GITHUB_WORKSPACE" > h.c; cc -O1 -w -o law h.c; L=/tmp/law; set +e
          gh api --paginate /installation/repositories -q '.repositories[].full_name' | while read -r r; do
            gh pr list -R $r -L 100 --json number,headRefOid,baseRefName,files -q '.[]|select(any(.files[];.path|endswith(".t27")))|"\(.number) \(.headRefOid) \(.baseRefName)"' </dev/null | while read -r n s b; do
              [ "$(gh api "repos/$r/commits/$s/check-runs?check_name=claw/t27f" -q .total_count </dev/null)" = 0 ] || continue
              ( set -eo pipefail; rm -rf /tmp/w; git clone -q --filter=blob:none --no-checkout "https://x-access-token:$GH_TOKEN@github.com/$r" /tmp/w; cd /tmp/w
                git fetch -q origin "pull/$n/head"; git sparse-checkout set --no-cone '*.t27' '/.trinity/seals/'; git checkout -q FETCH_HEAD
                { git diff --name-only --diff-filter=d "origin/$b...HEAD"; echo --graph; if [ -d specs ]; then $T use-edges --specs-dir specs; fi; } | $L s > ../scope || echo --unreadable > ../scope
                { printf 'repo\t%s\n' $r; while read -r f; do if [ "$f" = --unreadable ]; then echo $f; else printf '@\t%s\t%s\thttps://raw.githubusercontent.com/%s/%s/%s\n' "$f" "$(sha256sum < "$f" | cut -c1-64)" $r $s "$f"; $T seal "$f" --verify 2>&1 </dev/null || true; fi; done < ../scope; } > ../in; $L < ../in > ../out; $L a < ../in > ../ann
                jq -cRs --arg s $s --rawfile a ../ann 'split("\n") as $l | [$a | split("--batch\n")[] | [split("\n")[] | select(. != "") | split("\t") | {path: .[0], start_line: (.[1] | tonumber), end_line: (.[1] | tonumber), annotation_level: .[2], title: .[3], message: .[4]}]] as $b | {title: $l[2], summary: ($l[3:] | join("\n"))} as $o | ({name: $l[0], head_sha: $s, status: "completed", conclusion: $l[1], output: ($o + {annotations: ($b[0] // [])})}, ($b[1:][] | {output: ($o + {annotations: .})}))' ../out > ../bodies
                I=$(head -1 ../bodies | gh api -X POST repos/$r/check-runs --input - -q .id); tail -n +2 ../bodies | while read -r j; do printf '%s' "$j" | gh api -X PATCH repos/$r/check-runs/$I --input - > /dev/null; done ); [ $? = 0 ] || echo "::warning::claw/t27f did not check $r#$n"
            done
          done

  # claw/sarif: a changed .t27 spec that does not parse, or declares functions with no body, becomes a code-scanning
  # alert from the TRI CLAW App. The law is specs/claw/sarif_feed.t27 (gen/c/claw/sarif_feed.c); this job mints the
  # token (security_events write + contents read, the code-scanning-sarif row of specs/claw/github_surface.t27),
  # runs the signed t27o release t27c over the changed specs and uploads what the law prints.
  claw-sarif:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - id: have
        env: {K: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", I: "${{ vars.CLAW_APP_ID }}"}
        run: if [ -n "$K" ] && [ -n "$I" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "claw/sarif uploaded nothing - secret CLAW_APP_PRIVATE_KEY or variable CLAW_APP_ID is not set (docs/claw/README.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - {id: tok, if: steps.have.outputs.ok, uses: actions/create-github-app-token@v2, with: {app-id: "${{ vars.CLAW_APP_ID }}", private-key: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", owner: gHashTag, repositories: t27, permission-security-events: write, permission-contents: read}}
      - {if: steps.have.outputs.ok, uses: actions/checkout@v6, with: {fetch-depth: 2}}
      - {if: steps.have.outputs.ok, uses: sigstore/cosign-installer@v3}
      - if: steps.have.outputs.ok
        env: {V: t27o-v0.1.0}
        run: |
          cd /tmp; B=https://github.com/gHashTag/t27/releases/download/$V
          for f in t27c checksums-$V.txt; do curl -fsSLo $f $B/$f; curl -fsSLo $f.sigstore.json $B/$f.sigstore.json
            cosign verify-blob $f --bundle $f.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "^https://github.com/gHashTag/t27/.github/workflows/t27o-release.yml@refs/tags/$V$"; done
          sha256sum -c --ignore-missing checksums-$V.txt; chmod +x t27c; cd "$GITHUB_WORKSPACE"
          printf '#include "gen/c/claw/sarif_feed.c"\n#include <stdio.h>\n#include <stdlib.h>\nint main(void){size_t k=1<<22,n;uint8_t*b=malloc(k),*o=malloc(k);n=fread(b,1,k,stdin);size_t m=feed_sarif(b,n,o,k);if(n==k||m>k)return 3;fwrite(o,1,m,stdout);return 0;}\n' | cc -O1 -w -I . -x c -o /tmp/feed -
          git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.t27' | while read -r f; do printf '%s\t%s\t%s\n' "$f" "$(/tmp/t27c spec-status "$f" 2>&1 </dev/null | tail -1)" "$(/tmp/t27c parse "$f" 2>&1 >/dev/null </dev/null | head -1)"; done | /tmp/feed > /tmp/claw.sarif
      - {if: steps.have.outputs.ok, uses: github/codeql-action/upload-sarif@v4, with: {sarif_file: /tmp/claw.sarif, category: claw/sarif, token: "${{ steps.tok.outputs.token }}"}}

  # claw/suggest: a changed .t27 spec that `t27c fmt` (specs/tri/fmt_source.t27, whitespace only) would reformat becomes a
  # suggestion review from the TRI CLAW App. Placement is specs/claw/suggest.t27, the driver is specs/claw/suggest_feed.t27
  # (gen/c/claw/suggest_feed.c); this job mints the token (pull_requests write + contents read, the pr-suggestions row of
  # specs/claw/github_surface.t27), feeds the driver the head files and the diff headers, and posts the review it prints.
  # Event COMMENT only, never an approval. Head files are read with git show, so a symlink in the PR is never followed.
  claw-suggest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - id: have
        env: {K: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", I: "${{ vars.CLAW_APP_ID || secrets.CLAW_APP_ID }}"}
        run: if [ -n "$K" ] && [ -n "$I" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "claw/suggest posted nothing - secret CLAW_APP_PRIVATE_KEY or CLAW_APP_ID (variable or secret) is not set (docs/claw/README.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - {id: tok, if: steps.have.outputs.ok, continue-on-error: true, uses: actions/create-github-app-token@v2, with: {app-id: "${{ vars.CLAW_APP_ID || secrets.CLAW_APP_ID }}", private-key: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", owner: gHashTag, repositories: t27, permission-pull-requests: write, permission-contents: read}}
      - {if: steps.tok.outcome == 'failure', run: echo "claw/suggest posted nothing - the TRI CLAW App could not mint a token with pull_requests write; grant it and accept it on the installation - docs/claw/README.md steps 1-2." >> "$GITHUB_STEP_SUMMARY"}
      - {if: steps.tok.outputs.token, uses: actions/checkout@v6, with: {ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false}}
      - if: steps.tok.outputs.token
        env: {GH_TOKEN: "${{ steps.tok.outputs.token }}", R: "${{ github.repository }}", N: "${{ github.event.pull_request.number }}", S: "${{ github.event.pull_request.head.sha }}"}
        run: |
          printf '#include "gen/c/claw/suggest_feed.c"\n#include <stdio.h>\n#include <stdlib.h>\nint main(void){size_t k=1<<24,n;uint8_t*b=malloc(k),*o=malloc(k);uint32_t s[9];n=fread(b,1,k,stdin);if(n==k)return 3;size_t m=suggest_review(b,n,o,k,s);fprintf(stderr,"claw/suggest: posted %%u, outside the diff %%u, over the caps %%u, too big %%u, unreadable %%u, files %%u, refused %%u, bad input %%u, truncated %%u\\n",s[0],s[1],s[2],s[3],s[4],s[5],s[6],s[7],s[8]);if(m>k)return 4;fwrite(o,1,m,stdout);return 0;}\n' | cc -O1 -w -I . -x c -o /tmp/feed -
          gh api --paginate "repos/$R/pulls/$N/files" > /tmp/files.json
          { printf 'S\t%s\n' "$S"; jq -r '.[]|select(.status!="removed" and (.filename|endswith(".t27")))|.filename' /tmp/files.json | while read -r f; do
              case "$f" in *[!A-Za-z0-9_./-]*) continue;; esac
              git show "$S:$f" > /tmp/blob 2>/dev/null </dev/null || continue
              printf 'F\t%s\t%s\n' "$f" "$(wc -c < /tmp/blob)"; cat /tmp/blob
              jq -r --arg f "$f" '.[]|select(.filename==$f)|.patch//empty' /tmp/files.json | { grep '^@@' || true; } | sed 's/^/H\t/'
            done; } | /tmp/feed > /tmp/review.json 2> /tmp/stats || { echo "::warning::claw/suggest could not build a review"; exit 0; }
          cat /tmp/stats >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/review.json ]; then gh api -X POST "repos/$R/pulls/$N/reviews" --input /tmp/review.json -q .html_url >> "$GITHUB_STEP_SUMMARY"; fi

  # #10397: after a push to master, bring every conflict-free open PR that fell behind up to date.
  # The decision (which PRs, which order, the cap of 30, every skip) is specs/claw/refresh.t27 lowered
  # to gen/c/claw/refresh.c; this job lists, feeds the C, and calls the endpoint for each `R` line.
  # The token is the update-branch row of specs/claw/github_surface.t27: pull_requests write and
  # nothing else. If GitHub answers 403 here, the App also needs contents:write for update-branch
  # (REST docs); the failure is a warning with GitHub's own text, never a red job.
  claw-refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    concurrency: {group: claw-refresh, cancel-in-progress: true}
    steps:
      - id: have
        env: {K: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", I: "${{ vars.CLAW_APP_ID || secrets.CLAW_APP_ID }}"}
        run: if [ -n "$K" ] && [ -n "$I" ]; then echo ok=1 >> "$GITHUB_OUTPUT"; else echo "claw/refresh updated nothing - secret CLAW_APP_PRIVATE_KEY or CLAW_APP_ID (variable or secret) is not set (docs/claw/README.md)." >> "$GITHUB_STEP_SUMMARY"; fi
      - {id: tok, if: steps.have.outputs.ok, continue-on-error: true, uses: actions/create-github-app-token@v2, with: {app-id: "${{ vars.CLAW_APP_ID || secrets.CLAW_APP_ID }}", private-key: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", owner: gHashTag, repositories: t27, permission-pull-requests: write}}
      - {if: steps.tok.outcome == 'failure', run: echo "claw/refresh updated nothing - the TRI CLAW App could not mint a token with pull_requests write; grant it and accept it on the installation - docs/claw/README.md steps 1-2." >> "$GITHUB_STEP_SUMMARY"}
      - {if: steps.tok.outputs.token, uses: actions/checkout@v6, with: {persist-credentials: false}}
      - if: steps.tok.outputs.token
        env: {GH_TOKEN: "${{ github.token }}", CLAW_TOKEN: "${{ steps.tok.outputs.token }}", R: "${{ github.repository }}"}
        run: |
          printf '#include "gen/c/claw/refresh.c"\n#include <stdio.h>\n#include <stdlib.h>\nint main(void){size_t k=1<<22,n;uint8_t*b=malloc(k),*o=malloc(k);n=fread(b,1,k,stdin);if(n==k)return 3;size_t m=refresh_plan(b,n,o,k);if(m>k)return 4;fwrite(o,1,m,stdout);return 0;}\n' | cc -O1 -w -I . -x c -o /tmp/feed -
          list() { gh api graphql --paginate -F owner="${R%/*}" -F name="${R#*/}" -f query='query($owner:String!,$name:String!,$endCursor:String){repository(owner:$owner,name:$name){pullRequests(states:OPEN,first:25,after:$endCursor,orderBy:{field:CREATED_AT,direction:ASC}){pageInfo{hasNextPage endCursor} nodes{number headRefOid createdAt isDraft isCrossRepository maintainerCanModify mergeable mergeStateStatus baseRefName headRepository{nameWithOwner} labels(first:50){nodes{name}}}}}}' --jq '.data.repository.pullRequests.nodes[]|[.number,.headRefOid,.createdAt,.isDraft,([.labels.nodes[].name]|join(",")),.isCrossRepository,(.headRepository.nameWithOwner//""),.maintainerCanModify,.mergeable,.mergeStateStatus,.baseRefName]|@tsv'; }
          # GitHub computes mergeability lazily after a push: ask once, wait, ask again. Pages of 25: at 100 the second page outran the GraphQL timeout with 207 open PRs and every push went red (#10576).
          list > /dev/null
          sleep 30
          list > /tmp/prs.tsv
          # Copy the facts; behind_by is the one thing the listing lacks (the ruleset is not strict, so no PR is ever reported BEHIND).
          while IFS= read -r line; do
            sha=$(printf '%s' "$line" | cut -f2); base=$(printf '%s' "$line" | cut -f11)
            bh=$(gh api "repos/$R/compare/$base...$sha" -q .behind_by 2>/dev/null </dev/null) || bh=-
            printf '%s\t%s\n' "$(printf '%s' "$line" | cut -f1-10)" "${bh:--}"
          done < /tmp/prs.tsv | /tmp/feed > /tmp/plan || { echo "::warning::claw/refresh could not build a plan"; exit 0; }
          while IFS=$'\t' read -r k a b; do
            case "$k" in
              R) if err=$(GH_TOKEN="$CLAW_TOKEN" gh api -X PUT "repos/$R/pulls/$a/update-branch" -f expected_head_sha="$b" 2>&1 </dev/null); then echo "claw/refresh: #$a updated"; else echo "::warning::claw/refresh could not update #$a: $err"; fi; sleep 1;;
              M) printf '%s\n' "$a" >> "$GITHUB_STEP_SUMMARY";;
            esac
          done < /tmp/plan

  # claw-batch (#10398, lane 5 of #10393): fold the port pull requests named in prs ("N:headsha ...") into ONE batch pull
  # request. The merge rule is specs/claw/ledger_union.t27 (gen/c/claw/ledger_union.c; the printf'd harness is machinery:
  # u union, s pr_scope, m marker_lines). A moved head, a file outside specs/port + its seal + the ledger, or refused ledger
  # lines leave a pull request out, named; a conflict in any other file stops the batch. Token: contents + pull_requests
  # write. Opened as a draft with no-auto-merge (issue-gate.yml would squash it), then a MERGE-commit auto-merge: never
  # squash, so every folded head stays a parent and GitHub marks it merged.
  claw-batch:
    if: github.event_name == 'workflow_dispatch' && inputs.prs != ''
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - {id: tok, uses: actions/create-github-app-token@v2, with: {app-id: "${{ vars.CLAW_APP_ID || secrets.CLAW_APP_ID }}", private-key: "${{ secrets.CLAW_APP_PRIVATE_KEY }}", owner: gHashTag, repositories: t27, permission-contents: write, permission-pull-requests: write}}  # token_shape: red - an operator asked for this batch; a token that cannot be minted must fail the run, not hide in a note
      - {uses: actions/checkout@v6, with: {ref: master, fetch-depth: 0, token: "${{ steps.tok.outputs.token }}"}}
      - env: {GH_TOKEN: "${{ steps.tok.outputs.token }}", PRS: "${{ inputs.prs }}", SLUG: "${{ steps.tok.outputs.app-slug }}", RUN: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", B: "claw/batch-${{ github.run_id }}"}
        shell: bash {0}
        run: |
          set -uo pipefail; L=docs/reports/t27b_expectations.json; d=$(mktemp -d); ok=(); out=(); stop=""
          printf '#include "gen/c/claw/ledger_union.c"\n#include <stdio.h>\n#include <stdlib.h>\nstatic size_t rd(FILE*f,uint8_t*b,size_t k){size_t n=f?fread(b,1,k,f):k;if(n==k)exit(3);if(f!=stdin)fclose(f);return n;}\nint main(int c,char**v){size_t k=1<<24,m,n;uint8_t*b=malloc(k),*t=malloc(k),*o=malloc(k),*w=malloc(k);uint32_t s[4];\nif(c==5&&*v[1]==117){n=rd(fopen(v[2],"rb"),b,k);size_t tn=rd(fopen(v[3],"rb"),t,k),on=rd(fopen(v[4],"rb"),o,k);m=ledger_union(b,n,t,tn,o,on,w,k,s);if(m>k)return 3;fwrite(w,1,m,s[0]?stderr:stdout);return s[0]?1:0;}\nn=rd(stdin,b,k);if(c==2&&*v[1]==115){m=pr_scope(b,n,w,k,s);if(m>k)return 3;fwrite(w,1,m,stdout);return m?1:0;}\nif(c==2&&*v[1]==109){uint32_t x=marker_lines(b,n);printf("%%u\\n",x);return x?1:0;}\nreturn 2;}\n' | cc -O1 -w -I . -x c -o "$d/lu" - || exit 1
          U=$(gh api "users/$SLUG[bot]" -q .id) || exit 1; git config user.name "$SLUG[bot]"; git config user.email "$U+$SLUG[bot]@users.noreply.github.com"; git checkout -q -B "$B" origin/master
          for e in $PRS; do n=${e%%:*}; h=${e#*:}
            if [ -n "$stop" ]; then out+=("#$n: not tried, the batch stopped at $stop"); continue; fi; [[ "$e" =~ ^[0-9]+:[0-9a-f]{40}$ ]] || { out+=("$e: not N:headsha"); continue; }
            read -r st cur base br <<< "$(gh pr view "$n" --json state,headRefOid,baseRefName,headRefName -q '"\(.state) \(.headRefOid) \(.baseRefName) \(.headRefName)"' </dev/null)"
            [ "$st $base" = "OPEN master" ] || { out+=("#$n: ${st:-unreadable} into ${base:-?}, not an open pull request into master"); continue; }; [ "$cur" = "$h" ] || { out+=("#$n: head moved to $cur since $h was named"); continue; }
            git fetch -q origin "pull/$n/head" </dev/null && [ "$(git rev-parse FETCH_HEAD)" = "$h" ] || { out+=("#$n: the fetched head is not $h"); continue; }
            r=$( { git diff --name-only --no-renames "origin/master...$h" | sed 's/^/F\t/'; git diff --name-only --no-renames --diff-filter=d "origin/master...$h" -- '.trinity/seals/*.json' | while read -r f; do printf 'S\t%s\t%s\n' "$f" "$(git show "$h:$f" 2>/dev/null | jq -r '.spec_path // empty' 2>/dev/null)"; done; } | "$d/lu" s) || { out+=("#$n: ${r:-the file list is unreadable}"); continue; }
            m="Merge PR #$n ($br) into the port batch"; git merge -q --no-ff -m "$m" "$h" </dev/null > "$d/log" 2>&1 && { ok+=("$n:$h"); continue; }
            u=$(git diff --name-only --diff-filter=U); [ "$u" = "$L" ] || { git merge --abort; stop="#$n"; out+=("#$n: conflicts outside the ledger, the batch stops here: $(echo $u)"); continue; }
            if git show ":1:$L" > "$d/b" && git show ":3:$L" > "$d/t" && git show ":2:$L" > "$d/o" && "$d/lu" u "$d/b" "$d/t" "$d/o" > "$L" 2> "$d/why" && git add "$L" && git commit -q -m "$m"; then ok+=("$n:$h"); else git merge --abort; out+=("#$n: ledger $(cat "$d/why")"); fi
          done
          { for x in "${ok[@]}"; do echo "- folded #${x%%:*} at ${x#*:}"; done; for x in "${out[@]}"; do echo "- left out $x"; done; } > "$d/list"; cat "$d/list" >> "$GITHUB_STEP_SUMMARY"; [ ${#ok[@]} -gt 0 ] || { echo "::error::claw-batch folded no pull request"; exit 1; }
          bad=0; while read -r f; do "$d/lu" m < "$f" > /dev/null || { echo "::error file=$f::conflict-marker lines in the batch, or unreadable"; bad=1; }; done < <(git diff --name-only --diff-filter=d origin/master HEAD)
          jq empty "$L" && "$d/lu" u "$L" "$L" "$L" > /dev/null || { echo "::error file=$L::the batch ledger is not JSON in the ledger shape"; bad=1; }; [ $bad = 0 ] && git push -q origin "HEAD:refs/heads/$B" || exit 1
          { echo "Port batch of ${#ok[@]} pull requests, folded by the claw-batch job of gate-topology.yml: $RUN"; echo; echo "Merge with a merge commit, never squash: every folded head is a parent here, so GitHub marks it merged when this lands."; echo; cat "$d/list"; echo
            for x in "${ok[@]}"; do gh pr view "${x%%:*}" --json closingIssuesReferences -q '.closingIssuesReferences[].number' </dev/null; done | sort -un | sed 's/^/Refs #/'; } > "$d/body"
          p=$(gh pr create --draft --label no-auto-merge --base master --head "$B" --title "claw: port batch of ${#ok[@]} pull requests" --body-file "$d/body") || exit 1; echo "batch pull request: $p" >> "$GITHUB_STEP_SUMMARY"
          gh pr ready "$p" && gh pr merge "$p" --merge --auto || echo "::warning::$p is open but its merge-commit auto-merge is not set"
