name: t27o golden specs
on:
  workflow_call:
    inputs:
      mode: {type: string, default: golden, description: "scan | golden | check (specs/tools/t27o/service.t27)"}
      paths: {type: string, default: "*.rs", description: "git pathspec of Rust files"}
      version: {type: string, default: t27o-v0.1.0, description: "signed t27o-v* release tag"}
permissions:
  contents: write
  pull-requests: write
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: sigstore/cosign-installer@v3
      - uses: taiki-e/install-action@v2
        with: {tool: zig@0.16.0}
      - name: verify the signed toolchain (keyless, no secrets)
        run: |
          V="${{ inputs.version }}"
          B="https://github.com/gHashTag/t27/releases/download/$V"
          for f in tri t27c "checksums-$V.txt"; do
            curl -fsSLo "$f" "$B/$f" && curl -fsSLo "$f.sigstore.json" "$B/$f.sigstore.json"
            cosign verify-blob "$f" --bundle "$f.sigstore.json" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --certificate-identity-regexp "^https://github.com/gHashTag/t27/.github/workflows/t27o-release.yml@refs/tags/$V$"
          done
          shasum -a 256 -c "checksums-$V.txt" && chmod +x tri t27c
      - name: tri t27o --check over the caller's Rust files
        run: |
          s=0
          for f in $(git ls-files -co --exclude-standard -- ${{ inputs.paths }}); do ./tri t27o "$f" --check --t27c ./t27c || s=1; done
          exit $s
      - name: "check mode: fail on committed-spec drift"
        if: ${{ inputs.mode == 'check' }}
        run: git diff --exit-code -- specs/t27o_check
      - name: "golden mode: open a PR with the specs and the refusals"
        if: ${{ inputs.mode == 'golden' }}
        uses: peter-evans/create-pull-request@v7
        with: {title: "t27o golden specs (${{ inputs.version }})", commit-message: "t27o golden specs (${{ inputs.version }})", paths: specs/t27o_check, body: "golden means equivalent on the recorded oracle vectors and translated tests, not a proof for all inputs -- specs/tools/t27o/service.t27, gHashTag/t27 #8996\n- provenance: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
