name: Seal Coverage

# Seal Coverage -- a required check (docs/BRANCH-PROTECTION.md) that used to be an
# unconditional `echo`. A seal records spec_path, spec_hash and the sha256 of each
# generated target at sealing time; its invariant is that the spec still exists and
# still hashes to what was recorded, else the four gen_hashes assert something false.
# Broken seals are debt in tools/seal_baseline.txt (207 at gate birth: 89 dangling,
# 113 stale, 5 without spec_path), so the gate holds the line without a big-bang fix.
# The job id below IS the status-check CONTEXT branch protection matches on --
# renaming it silences a required check while every visible check stays green (#2191).

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately: it would silence this gate on any
    # PR whose base is not listed (a stacked PR gets a false green). Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below stays: a cost decision.
  push:
    branches: [master]
  workflow_dispatch: {inputs: {only: {description: 'space-separated spec paths to re-seal', required: false, default: ''}}}

# A run for a commit that has since been superseded measures nothing anyone
# will read. Without a group, every merge to master queued one more run of
# this gate behind the last: 62 were waiting on 2026-09-17 while the 15
# workflows that do carry a group had exactly one each.
concurrency:
  group: seal-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # T70: this gate classifies a broken seal as `dangling` (spec was
          # committed, then deleted -- remove the seal with it) or `phantom`
          # (spec appears in NO commit -- find it or drop the seal), and it
          # decides from `git log --all`. A depth-1 checkout has no history,
          # so the dangling arm could never fire here and all 74 printed as
          # phantom with the wrong repair attached. l1-traceability.yml
          # already sets this for the same reason.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate now recomputes each seal's four gen_hashes, which needs the
      # compiler. Before this it compared only spec_hash: setting gen_hash_zig
      # to zeros passed, so a seal could assert false output indefinitely as
      # long as nobody touched the spec. Without the binary the gate exits 2 and
      # says so, rather than reporting a pass it did not earn.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler the seals are checked against
        run: cargo build --release -p t27c

      # A gate nobody has seen fail is not a gate: this plants a stale seal and a
      # dangling one in a temp tree and proves both are reported while a good one
      # stays silent.
      - name: Negative control
        run: python3 tools/check_seal_coverage.py --self-check

      - name: Every seal still describes its spec
        run: python3 tools/check_seal_coverage.py

  resync:
    # Re-saves stale seals with a master t27c and uploads them; it never commits (a lane lands them, #13835).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/checkout@v7, with: {fetch-depth: 0}}
      - {uses: dtolnay/rust-toolchain@stable}
      - {uses: Swatinem/rust-cache@v2}
      - name: Build t27c
        run: cargo build --release -p t27c
      - {name: Install zig 0.16.0, run: 'curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C "$RUNNER_TEMP" && echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"'}
      - name: Re-seal what the frontier names (report-only verdict)
        env: {ONLY: '${{ inputs.only }}'}
        run: ./target/release/t27c frontier --reseal ${ONLY:+--only $ONLY} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/frontier.log" || true; for p in $(sed -n 's/^kept the old seal //p' "$RUNNER_TEMP/frontier.log"); do ./target/release/t27c seal "$p" 2>&1 | tail -n 15 | sed "s|^|$p -- |" | tee -a "$GITHUB_STEP_SUMMARY"; done; git ls-files -m -o -z --exclude-standard -- .trinity/seals | tar -czf "$RUNNER_TEMP/resealed-seals.tgz" --null -T -
      - {uses: actions/upload-artifact@v4, with: {name: resealed-seals, path: '${{ runner.temp }}/resealed-seals.tgz', if-no-files-found: ignore}}
