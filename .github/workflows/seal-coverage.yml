name: Seal Coverage

# The job id below is the status-check CONTEXT branch protection matches on. Renaming it
# makes the required context stop reporting and the PR goes BLOCKED with every visible
# check green -- learned the hard way in #2191. The full gate lore (a seal records
# spec_path, spec_hash and the four gen hashes; a gate that cannot fail is worse than
# none; the baseline is debt, not license) lives in git history and the checker header.

on:
  pull_request:
    # No `branches:` filter on pull_request, deliberately. A branch filter makes
    # this gate silent on any PR whose base is not listed -- a stacked PR then
    # shows a green check list that a master-based PR would not get. Enforced by
    # scripts/ci/check_pr_branch_filters.py. The `push` filter below, where one
    # exists, is left alone: restricting post-merge runs is a cost decision.
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: seal-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # T70: this gate classifies a broken seal as `dangling` (spec was
          # committed, then deleted -- remove the seal with it) or `phantom`
          # (spec appears in NO commit -- find it or drop the seal), and it
          # decides from `git log --all`. A depth-1 checkout has no history,
          # so the dangling arm could never fire here and all 74 printed as
          # phantom with the wrong repair attached. l1-traceability.yml
          # already sets this for the same reason.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate recomputes each seal's four gen_hashes, which needs the compiler: without
      # the binary it exits 2 and says so, rather than reporting a pass it did not earn.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler the seals are checked against
        run: cargo build --release -p t27c

      # A gate nobody has seen fail is not a gate: the self-check plants both defects.
      - name: Negative control
        run: python3 tools/check_seal_coverage.py --self-check

      - name: Every seal still describes its spec
        run: python3 tools/check_seal_coverage.py

  # Dispatch-only; the law is specs/crons/t27-seal-resync.t27 (#12733): reseals exactly
  # what the check names, with CI's compiler, and opens one PR of seals only.
  resync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v1
      - run: cargo build --release -p t27c
      - name: Reseal what the check names and open one PR
        run: |
          python3 tools/check_seal_coverage.py > /tmp/cov.txt || true
          grep -E "still hashes the same|changed since sealing" /tmp/cov.txt | grep -oE "specs/[a-zA-Z0-9_/.-]+\.t27" | sort -u > /tmp/stale.txt
          git checkout -b "seals/resync-${{ github.run_id }}"
          while read -r s; do ./target/release/t27c seal "$s" --save; done < /tmp/stale.txt
          git add .trinity/seals
          git -c user.name=tri-claw -c user.email=actions@t27.ai commit -m "seals: resync the batch the coverage gate named (Closes #12733)"
          git push origin HEAD
          GH_TOKEN: ${{ github.token }} gh pr create --head "seals/resync-${{ github.run_id }}" --base master --title "seals: resync the batch the coverage gate named (Closes #12733)" --body "Machine reseal of exactly the specs the gate named on this run. No baseline changes."
