# The T27 OS lab executor (specs/os/lab.t27 is the contract; t27#11781 the migration).
# Foreign file (.yml) under owner-approved-foreign, granted by the owner in session
# on 2026-10-23 (this chat): "owner-approved-foreign". One dispatch = one run:
# checkout Trinity-S-AI-DNA/t27 at the requested sha, build t27c, test-report the named
# specs, publish the receipt into THIS repo's runs/ directory. No Railway anywhere.
name: lab
# re-registration touch 2026-10-23: the dispatch API cached the pre-trigger definition
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 't27 master sha to test; empty = the current master'
        required: false
        default: ''
      challenge:
        description: 'requester challenge; only its sha256 is published; empty = generated'
        required: false
        default: ''
      specs:
        description: 'space-separated spec paths; empty = the default core set'
        required: false
        default: 'specs/t27f/work_graph.t27 specs/queen/actors.t27 specs/t27f/export_video.t27 specs/t27f/frame_render.t27 specs/t27f/live_mode.t27 specs/t27f/hud.t27'
      m6:
        description: 'true = render the 900-frame export schedule and encode queen-live.mp4'
        required: false
        default: 'true'
      wasm:
        description: 'true = build the live closure scalar-plane wasm'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: lab-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: check out this repo (receipt home)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: resolve the sha (accepts short; empty = master)
        id: sha
        run: |
          REF=${{ inputs.sha }}
          [ -z "$REF" ] && REF=master
          FULL=$(curl -s https://api.github.com/repos/Trinity-S-AI-DNA/t27/commits/$REF | jq -r .sha)
          echo "resolved=$FULL" >> "$GITHUB_OUTPUT"
          echo "resolved: $FULL"

      - name: check out t27 at the requested sha
        uses: actions/checkout@v4
        with:
          repository: Trinity-S-AI-DNA/t27
          ref: ${{ steps.sha.outputs.resolved }}
          path: t27
          persist-credentials: false

      - name: install zig (test-report runs zig tests; the t27 CI's own recipe)
        run: |
          mkdir -p /tmp/zig
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: build t27c
        run: |
          cd t27
          cargo build --release -p t27c
          ./target/release/t27c --version | tee /tmp/t27c_version.txt

      - name: test-report every named spec
        shell: bash
        run: |
          cd t27
          mkdir -p /tmp/out
          i=0
          for spec in ${{ inputs.specs }}; do
            i=$((i+1))
            ./target/release/t27c test-report "$spec" > /tmp/out/report_$i.txt 2>&1 || echo "$spec|test-report exited non-zero" >> /tmp/out/failed.txt
            tests=$(grep -E '^  tests' /tmp/out/report_$i.txt | awk '{print $2}' || true)
            pass=$(grep -E '^  pass'  /tmp/out/report_$i.txt | awk '{print $2}' || true)
            fail=$(grep -E '^  FAIL' /tmp/out/report_$i.txt | awk '{print $2}' || true)
            vac=$(grep -E 'vacuous passes' /tmp/out/report_$i.txt | awk '{print $3}' || true)
            blocked=$(grep -c BLOCKED /tmp/out/report_$i.txt || true)
            echo "${spec}|tests=${tests:-NA}|pass=${pass:-NA}|FAIL=${fail:-NA}|vacuous=${vac:-NA}|blocked=${blocked}" >> /tmp/out/summary.txt
          done
          cat /tmp/out/summary.txt

      - name: check the encoder plumbing (M6 -- export_video encodes on the lab; distro ffmpeg first, static build as fallback, never fatal -- t27os#10)
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1 | tee /tmp/ffmpeg.txt
          else
            curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp || echo "ffmpeg: the static CDN failed; the receipt keeps the distro-absent state"
            FFMPEG_DIR=$(ls -d /tmp/ffmpeg-*static 2>/dev/null | head -1)
            if [ -n "$FFMPEG_DIR" ]; then
              echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
              export PATH="$FFMPEG_DIR:$PATH"
            fi
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -version | head -1 | tee /tmp/ffmpeg.txt
            else
              echo "ffmpeg absent (receipt stays truthful, M6 encode will fail visibly)" | tee /tmp/ffmpeg.txt
            fi
          fi

      - name: M6 -- render the 900-frame schedule and encode queen-live.mp4
        if: inputs.m6 == 'true'
        shell: bash
        run: |
          set -e
          cd t27
          mkdir -p /tmp/m6
          ./target/release/t27c gen specs/t27f/frame_render.t27 > /tmp/m6/frame_render.zig
          cat > /tmp/m6/main.zig <<'ZIG'
          const std = @import("std");
          const fr = @import("frame_render.zig");

          pub fn main() !void {
              const alloc = std.heap.page_allocator;
              var threaded: std.Io.Threaded = .init(alloc, .{});
              const io = threaded.io();
              const w: u32 = 1920;
              const h: u32 = 1080;
              const len = fr.ppm_len(w, h);
              const dst = try alloc.alloc(u8, len);
              var dir = std.Io.Dir.cwd();
              var file = try dir.createFile(io, "queen_frames.ppm", .{});
              defer file.close(io);
              var wbuf: [65536]u8 = undefined;
              var writer = file.writer(io, &wbuf);
              var k: u32 = 0;
              while (k < 900) : (k += 1) {
                  const rc = fr.frame_bytes(dst, 0, w, h, k);
                  if (rc != fr.FRAME_OK) return error.RenderFailed;
                  try writer.interface.writeAll(dst[0..len]);
              }
              try writer.interface.flush();
          }
          ZIG
          cd /tmp/m6
          # the heredoc carried the block-scalar indent; strip exactly 10 leading spaces
          sed -i 's/^          //' main.zig
          zig build-exe main.zig -O ReleaseFast
          # measured on this host (t27os#3 task 4): the render rate of the 900-frame loop
          t0=$(date +%s%N); ./main queen_frames.ppm 900; t1=$(date +%s%N)
          awk -v a="$t0" -v b="$t1" 'BEGIN{printf "render: %.2f fps, %.2f ms/frame avg over 900 frames (t27c gen frame_render.t27 -> zig ReleaseFast, whole loop clocked)\n", 900*1e9/(b-a), (b-a)/900/1e6}' | tee /tmp/render_stats.txt
          ffmpeg -y -loglevel error -f image2pipe -framerate 30 -vcodec ppm -i queen_frames.ppm -c:v libx264 -pix_fmt yuv420p queen-live.mp4
          sha256sum queen-live.mp4 | tee queen-live.mp4.sha256
          ls -la queen-live.mp4
          mkdir -p "$GITHUB_WORKSPACE/runs"
          printf '%s' "$CH" > "$GITHUB_WORKSPACE/runs/$file.challenge"
          cp queen-live.mp4 "$GITHUB_WORKSPACE/runs/queen-live.mp4"
          cp queen-live.mp4.sha256 "$GITHUB_WORKSPACE/runs/queen-live.mp4.sha256"
          cp /tmp/render_stats.txt "$GITHUB_WORKSPACE/runs/render_stats.txt"

      - name: wasm -- build the live closure's scalar plane
        if: inputs.wasm == 'true'
        shell: bash
        run: |
          set -e
          cd t27
          mkdir -p /tmp/wasm
          for spec in work_graph scene display_list motion hud live_mode live_stream; do
            ./target/release/t27c gen specs/t27f/$spec.t27 > /tmp/wasm/$spec.zig
          done
          cat > /tmp/wasm/export_live.zig <<'ZIG'
          // Hand glue for the T27F Live closure: the comptime walk exports every scalar pub fn
          // of the seven generated modules under its own name (C convention). The struct-path
          // (live_frame's pointers) is the v2 gx_ glue. Pattern: t27-mcp wasm/export.zig.
          const L = @import("live_mode.zig");
          const S = @import("scene.zig");
          const D = @import("display_list.zig");
          const M = @import("motion.zig");
          const H = @import("hud.zig");
          const LS = @import("live_stream.zig");
          const W = @import("work_graph.zig");

          const mods = .{ W, L, S, D, M, H, LS };

          fn seen(comptime i: usize, comptime name: []const u8) bool {
              inline for (mods, 0..) |m, k| if (k < i and @hasDecl(m, name)) return true;
              return false;
          }

          fn scalar(comptime T: type) bool {
              return switch (@typeInfo(T)) {
                  .int, .bool => true,
                  else => false,
              };
          }

          fn C(comptime f: anytype) type {
              const I = @typeInfo(@TypeOf(f)).@"fn";
              const P = I.params;
              const R = I.return_type.?;
              return switch (P.len) {
                  0 => struct { fn c() callconv(.c) R { return f(); } },
                  1 => struct { fn c(a: P[0].type.?) callconv(.c) R { return f(a); } },
                  2 => struct { fn c(a: P[0].type.?, b: P[1].type.?) callconv(.c) R { return f(a, b); } },
                  3 => struct { fn c(a: P[0].type.?, b: P[1].type.?, d: P[2].type.?) callconv(.c) R { return f(a, b, d); } },
                  4 => struct { fn c(a: P[0].type.?, b: P[1].type.?, d: P[2].type.?, e: P[3].type.?) callconv(.c) R { return f(a, b, d, e); } },
                  5 => struct { fn c(a: P[0].type.?, b: P[1].type.?, d: P[2].type.?, e: P[3].type.?, g: P[4].type.?) callconv(.c) R { return f(a, b, d, e, g); } },
                  else => @compileError("arity"),
              };
          }

          comptime {
              @setEvalBranchQuota(100000);
              for (mods, 0..) |m, i| for (@typeInfo(m).@"struct".decls) |d| {
                  if (seen(i, d.name)) continue;
                  const v = @field(m, d.name);
                  const T = @TypeOf(v);
                  if (@typeInfo(T) != .@"fn") continue;
                  const I = @typeInfo(T).@"fn";
                  if (I.params.len > 5 or !scalar(I.return_type.?)) continue;
                  var ok = true;
                  for (I.params) |p| ok = ok and scalar(p.type.?);
                  if (ok) @export(&C(v).c, .{ .name = d.name });
              };
          }
          ZIG
          cd /tmp/wasm
          # the heredoc carried the block-scalar indent; strip exactly 10 leading spaces
          sed -i 's/^          //' export_live.zig
          zig build-exe export_live.zig -target wasm32-freestanding -fno-entry -rdynamic -O ReleaseSmall -femit-bin=t27f_live.wasm
          sha256sum t27f_live.wasm | tee t27f_live.wasm.sha256
          cp t27f_live.wasm "$GITHUB_WORKSPACE/runs/t27f_live.wasm"
          cp t27f_live.wasm.sha256 "$GITHUB_WORKSPACE/runs/t27f_live.wasm.sha256"

      - name: write the receipt
        shell: bash
        run: |
          set -e
          mkdir -p runs
          CH="${{ inputs.challenge }}"
          [ -z "$CH" ] && CH="scheduled-$GITHUB_RUN_ID"
          c8=$(printf '%s' "$CH" | sha256sum | cut -c1-8)
          chash=$(printf '%s' "$CH" | sha256sum | cut -d' ' -f1)
          stamp=$(cd t27 && git rev-parse HEAD)
          file="runs/${{ steps.sha.outputs.resolved }}.${c8}.json"
          {
            echo '{'
            echo "  \"sha\": \"${{ steps.sha.outputs.resolved }}\","
            echo "  \"challenge_sha256\": \"$chash\","
            echo "  \"t27c_build_stamp\": \"$stamp\","
            echo "  \"t27c_version\": \"$(cat /tmp/t27c_version.txt | tr '\n' ' ' | sed 's/"/\\"/g')\","
            echo "  \"ffmpeg\": \"$(cat /tmp/ffmpeg.txt | sed 's/"/\\"/g')\","
            echo "  \"utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo '  "specs": ['
            first=1
            while IFS='|' read -r spec tests pass fail vac blocked; do
              [ $first -eq 0 ] && echo ','
              first=0
              echo "    {\"spec\": \"$spec\", \"tests\": \"$tests\", \"pass\": \"$pass\", \"FAIL\": \"$fail\", \"vacuous\": \"$vac\", \"blocked\": \"$blocked\"}"
            done < /tmp/out/summary.txt
            echo ''
            echo '  ]'
            echo '}'
          } > "$file"
          cp /tmp/out/summary.txt "runs/${{ steps.sha.outputs.resolved }}.${c8}.summary.txt"
          cat "$file"

      - name: publish the receipt
        shell: bash
        run: |
          git config user.name "t27os-lab"
          git config user.email "admin@t27.ai"
          git add runs/
          git commit -m "lab receipt: t27@${{ steps.sha.outputs.resolved }} challenge-sha256-published"
          # the surface master moves while a run builds; rebase onto it before publishing
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/master; then
              git push && break
            fi
            git rebase --abort 2>/dev/null || true
            git rebase --onto origin/master HEAD~1 2>/dev/null || true
            # redo the commit on the fresh base, then try again
            git reset --soft origin/master
            git commit -m "lab receipt: t27@${{ steps.sha.outputs.resolved }} challenge-sha256-published"
          done
          git push

      # The verdict gate (t27os#9): a named spec that is BLOCKED, FAIL or NA fails the run,
      # after the receipt landed, so the evidence never disappears again.
      - name: gate -- a named spec that is BLOCKED, FAIL or NA fails the run (receipt already published)
        if: always()
        shell: bash
        run: |
          { [ -s /tmp/out/summary.txt ] || { echo "::error::no test summary produced; a run without results is not a pass"; exit 1; }
            BAD=$(grep -E '\|FAIL=([1-9]|NA)\||\|blocked=([1-9]|NA)' /tmp/out/summary.txt || true
                  [ -s /tmp/out/failed.txt ] && grep -E . /tmp/out/failed.txt || true)
            if [ -n "$BAD" ]; then echo "::error::regression rows above (BLOCKED, FAIL or non-zero test-report exit)"; echo "$BAD"; exit 1; fi
            echo "gate: every named spec passed (FAIL=0, blocked=0)"; }

      # The closure watch (t27 specs/crons/t27-t27f-closure-lab.t27) names
      # Trinity-S-AI-DNA/trinity#1717 as its ON_FAILURE issue; this step is that
      # naming, gated to runs whose spec list touches t27f so core-set failures
      # do not noise the page thread.
      - name: a FAIL names the closure watch (trinity 1717)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPECS: ${{ inputs.specs }}
        run: |
          case "$SPECS" in *t27f*) ;; *) echo "not a t27f run; no closure comment"; exit 0;; esac
          SUM=/tmp/out/summary.txt
          {
            echo "T27 OS lab run FAILED for t27@${{ steps.sha.outputs.resolved }} (closure watch, t27 specs/crons/t27-t27f-closure-lab.t27)."
            echo 'Failed specs, where the summary exists:'
            echo '```'
            grep -Ev '\|FAIL=0\|' "$SUM" 2>/dev/null | head -20 || echo '(no summary produced)'
            echo '```'
            echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/fail_comment.md
          gh api repos/Trinity-S-AI-DNA/trinity/issues/1717/comments -F body=@/tmp/fail_comment.md || echo "comment failed; the run log above still names it"
