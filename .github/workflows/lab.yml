# The T27 OS lab executor (specs/os/lab.t27 is the contract; t27#11781 the migration).
# Foreign file (.yml) under owner-approved-foreign, granted by the owner in session
# on 2026-10-23 (this chat): "owner-approved-foreign". One dispatch = one run:
# checkout Trinity-S-AI-DNA/t27 at the requested sha, build t27c, test-report the named
# specs, publish the receipt into THIS repo's runs/ directory. No Railway anywhere.
name: lab
# re-registration touch 2026-10-23: the dispatch API cached the pre-trigger definition
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 't27 master sha to test; empty = the current master'
        required: false
        default: ''
      challenge:
        description: 'requester challenge; only its sha256 is published; empty = generated'
        required: false
        default: ''
      specs:
        description: 'space-separated spec paths; empty = the default core set'
        required: false
        default: 'specs/t27f/work_graph.t27 specs/queen/actors.t27 specs/t27f/export_video.t27 specs/t27f/frame_render.t27 specs/t27f/live_mode.t27 specs/t27f/hud.t27'
      m6:
        description: 'true = render the 900-frame export schedule and encode queen-live.mp4'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: lab-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: check out this repo (receipt home)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: resolve the sha (accepts short; empty = master)
        id: sha
        run: |
          REF=${{ inputs.sha }}
          [ -z "$REF" ] && REF=master
          FULL=$(curl -s https://api.github.com/repos/Trinity-S-AI-DNA/t27/commits/$REF | jq -r .sha)
          echo "resolved=$FULL" >> "$GITHUB_OUTPUT"
          echo "resolved: $FULL"

      - name: check out t27 at the requested sha
        uses: actions/checkout@v4
        with:
          repository: Trinity-S-AI-DNA/t27
          ref: ${{ steps.sha.outputs.resolved }}
          path: t27
          persist-credentials: false

      - name: install zig (test-report runs zig tests; the t27 CI's own recipe)
        run: |
          mkdir -p /tmp/zig
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: build t27c
        run: |
          cd t27
          cargo build --release -p t27c
          ./target/release/t27c --version | tee /tmp/t27c_version.txt

      - name: test-report every named spec
        shell: bash
        run: |
          cd t27
          mkdir -p /tmp/out
          i=0
          for spec in ${{ inputs.specs }}; do
            i=$((i+1))
            if ./target/release/t27c test-report "$spec" > /tmp/out/report_$i.txt 2>&1; then :; fi
            tests=$(grep -E '^  tests' /tmp/out/report_$i.txt | awk '{print $2}' || true)
            pass=$(grep -E '^  pass'  /tmp/out/report_$i.txt | awk '{print $2}' || true)
            fail=$(grep -E '^  FAIL' /tmp/out/report_$i.txt | awk '{print $2}' || true)
            vac=$(grep -E 'vacuous passes' /tmp/out/report_$i.txt | awk '{print $3}' || true)
            blocked=$(grep -c BLOCKED /tmp/out/report_$i.txt || true)
            echo "${spec}|tests=${tests:-NA}|pass=${pass:-NA}|FAIL=${fail:-NA}|vacuous=${vac:-NA}|blocked=${blocked}" >> /tmp/out/summary.txt
          done
          cat /tmp/out/summary.txt

      - name: check the encoder plumbing (M6 -- export_video encodes on the lab)
        shell: bash
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp
          echo "/tmp/ffmpeg-"*"-static" | xargs -I{} sh -c 'echo "{}"' > /dev/null
          FFMPEG_DIR=$(ls -d /tmp/ffmpeg-*static | head -1)
          export PATH="$FFMPEG_DIR:$PATH"
          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1 | tee /tmp/ffmpeg.txt
          else
            echo "ffmpeg absent" | tee /tmp/ffmpeg.txt
          fi

      - name: M6 -- render the 900-frame schedule and encode queen-live.mp4
        if: inputs.m6 == 'true'
        shell: bash
        run: |
          set -e
          cd t27
          mkdir -p /tmp/m6
          ./target/release/t27c gen specs/t27f/frame_render.t27 > /tmp/m6/frame_render.zig
          cat > /tmp/m6/main.zig <<'ZIG'
          const std = @import("std");
          const fr = @import("frame_render.zig");

          pub fn main() !void {
              const alloc = std.heap.page_allocator;
              var threaded: std.Io.Threaded = .init(alloc, .{});
              const io = threaded.io();
              const w: u32 = 1920;
              const h: u32 = 1080;
              const len = fr.ppm_len(w, h);
              const dst = try alloc.alloc(u8, len);
              var dir = std.Io.Dir.cwd();
              var file = try dir.createFile(io, "queen_frames.ppm", .{});
              defer file.close(io);
              var wbuf: [65536]u8 = undefined;
              var writer = file.writer(io, &wbuf);
              var k: u32 = 0;
              while (k < 900) : (k += 1) {
                  const rc = fr.frame_bytes(dst, 0, w, h, k);
                  if (rc != fr.FRAME_OK) return error.RenderFailed;
                  try writer.interface.writeAll(dst[0..len]);
              }
              try writer.interface.flush();
          }
          ZIG
          cd /tmp/m6
          # the heredoc carried the block-scalar indent; strip exactly 10 leading spaces
          sed -i 's/^          //' main.zig
          zig build-exe main.zig -O ReleaseFast
          ./main queen_frames.ppm 900
          ffmpeg -y -loglevel error -f image2pipe -framerate 30 -vcodec ppm -i queen_frames.ppm -c:v libx264 -pix_fmt yuv420p queen-live.mp4
          sha256sum queen-live.mp4 | tee queen-live.mp4.sha256
          ls -la queen-live.mp4
          mkdir -p ../runs
          cp queen-live.mp4 ../runs/queen-live.mp4
          cp queen-live.mp4.sha256 ../runs/queen-live.mp4.sha256

      - name: write the receipt
        shell: bash
        run: |
          set -e
          mkdir -p runs
          CH="${{ inputs.challenge }}"
          [ -z "$CH" ] && CH="scheduled-$GITHUB_RUN_ID"
          c8=$(printf '%s' "$CH" | sha256sum | cut -c1-8)
          chash=$(printf '%s' "$CH" | sha256sum | cut -d' ' -f1)
          stamp=$(cd t27 && git rev-parse HEAD)
          file="runs/${{ inputs.sha }}.${c8}.json"
          {
            echo '{'
            echo "  \"sha\": \"${{ inputs.sha }}\","
            echo "  \"challenge_sha256\": \"$chash\","
            echo "  \"t27c_build_stamp\": \"$stamp\","
            echo "  \"t27c_version\": \"$(cat /tmp/t27c_version.txt | tr '\n' ' ' | sed 's/"/\\"/g')\","
            echo "  \"ffmpeg\": \"$(cat /tmp/ffmpeg.txt | sed 's/"/\\"/g')\","
            echo "  \"utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo '  "specs": ['
            first=1
            while IFS='|' read -r spec tests pass fail vac blocked; do
              [ $first -eq 0 ] && echo ','
              first=0
              echo "    {\"spec\": \"$spec\", \"tests\": \"$tests\", \"pass\": \"$pass\", \"FAIL\": \"$fail\", \"vacuous\": \"$vac\", \"blocked\": \"$blocked\"}"
            done < /tmp/out/summary.txt
            echo ''
            echo '  ]'
            echo '}'
          } > "$file"
          cp /tmp/out/summary.txt "runs/${{ inputs.sha }}.${c8}.summary.txt"
          cat "$file"

      - name: publish the receipt
        shell: bash
        run: |
          git config user.name "t27os-lab"
          git config user.email "admin@t27.ai"
          git add runs/
          git commit -m "lab receipt: t27@${{ inputs.sha }} challenge-sha256-published"
          # the surface master moves while a run builds; rebase onto it before publishing
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/master; then
              git push && break
            fi
            git rebase --abort 2>/dev/null || true
            git rebase --onto origin/master HEAD~1 2>/dev/null || true
            # redo the commit on the fresh base, then try again
            git reset --soft origin/master
            git commit -m "lab receipt: t27@${{ inputs.sha }} challenge-sha256-published"
          done
          git push
