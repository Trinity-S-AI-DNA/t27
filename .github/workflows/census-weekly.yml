name: Weekly Foreign Line Census

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml
      
      - name: Run census
        run: |
          python3 tools/census.py . > census_results.txt
      
      - name: Format census results
        run: |
          echo "# Foreign Line Debt Census" > README-census.md
          echo "" >> README-census.md
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README-census.md
          echo "" >> README-census.md
          echo "| Language | Hand-written Lines |" >> README-census.md
          echo "|----------|-------------------|" >> README-census.md
          
          # Parse census output and create markdown table
          while IFS=$'\t' read -r count lang _; do
            echo "| $lang | $count |" >> README-census.md
          done < census_results.txt
          
          echo "" >> README-census.md
          echo "*Excludes generated code (gen/, build/, vendored deps, etc.)*" >> README-census.md
      
      - name: Update README with census results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update weekly foreign line census'
          file_pattern: 'README-census.md'
          commit_user_name: 't27-census-bot'
          commit_user_email: 't27-census-bot@example.com'
          commit_author: 't27-census-bot <t27-census-bot@example.com>'
      
      - name: Create issue with census results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('census_results.txt', 'utf8');
            
            const issueBody = `# Weekly Foreign Line Census - ${new Date().toISOString().split('T')[0]}

## Results

| Language | Hand-written Lines |
|----------|-------------------|
${results.split('\n').filter(line => line.trim()).map(line => {
  const [count, lang] = line.split('\t');
  return `| ${lang} | ${count} |`;
}).join('\n')}

## Trend Analysis

*Excludes generated code (gen/, build/, vendored deps, etc.)*

This issue is automatically generated by the weekly census workflow.
`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Foreign Line Census - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['census', 'quality-gates', 'automated']
            });