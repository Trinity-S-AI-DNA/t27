name: PR Rebase Bot

# Mechanical DIRTY fixer: when every conflicted file is a seal
# (.trinity/seals/*.json -- master's side is the stale-KNOWN state the seal
# tools tolerate), merge master into the branch and push. Anything else stays
# human. Force-pushes only the PR's own head branch. Owner approval 2026-10-26.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: rebase seal-only DIRTY PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          for n in $(gh pr list --state open --limit 100 --json number,mergeStateStatus --jq '.[] | select(.mergeStateStatus=="DIRTY") | .number'); do
            gh pr view "$n" --json labels --jq '.labels[].name' | grep -qx 'no-auto-merge' && { echo "skip #$n"; continue; }
            git fetch -q origin "refs/pull/$n/head:refs/remotes/pr/$n"
            BAD=$(git merge-tree --write-tree --name-only origin/master "refs/remotes/pr/$n" 2>/dev/null | tail -n +2 | grep -v '^$' | grep -v '^\.trinity/seals/' || true)
            [ -n "$BAD" ] && { echo "skip #$n: $BAD"; continue; }
            git worktree add -q --detach wt origin/master
            (cd wt && git merge --no-commit "refs/remotes/pr/$n" >/dev/null 2>&1 || true
             git diff --name-only --diff-filter=U | while read -r f; do git checkout --ours "$f"; git add "$f"; done
             git commit -qm "rebase-bot: merge master; seals stale-known (queued #$n)")
            git push -q -f origin HEAD:"refs/heads/$(gh pr view "$n" --json headRefName --jq .headRefName)" && echo "rebased #$n"
            git worktree remove --force wt
          done
