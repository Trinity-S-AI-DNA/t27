name: PR Queue Drain

# Keeps the open PR queue fresh so branches never rot (issue: "PR queue drain").
# Every ten minutes: merge current master into each open PR head (update-branch)
# and arm GitHub's native auto-merge, which fires only when the branch ruleset's
# required checks are green. It never force-merges, never bypasses a ruleset,
# and skips drafts, PRs labeled no-auto-merge, and conflicted PRs. Foreign file
# by owner approval, 2026-10-26 -- see the pull request that added this.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: update-branch and arm auto-merge on every eligible PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh pr list --state open --limit 100 --json number,isDraft,mergeStateStatus \
            --jq '.[] | select(.isDraft == false) | "\(.number) \(.mergeStateStatus)"' |
          while read -r num state; do
            if gh pr view "$num" --json labels --jq '.labels[].name' | grep -qx 'no-auto-merge'; then
              echo "skip #$num no-auto-merge"; continue
            fi
            if [ "$state" = "DIRTY" ]; then echo "skip #$num conflicts"; continue; fi
            gh pr update-branch "$num" >/dev/null 2>&1 && echo "updated #$num" || true
            gh pr merge "$num" --squash --auto >/dev/null 2>&1 && echo "armed #$num" || echo "arm skipped #$num"
          done
