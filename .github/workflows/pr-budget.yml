name: PR budget (at most 20 open ready PRs per author; the excess waits as a draft)
# The rule is specs/policy/pr_budget.t27 (#10067, #10074); gen/c/policy/pr_budget.c is its t27c gen-c output
# (L2). This file is plumbing: it feeds the generated budget() one line for the event PR and one per other
# open PR of the same author, oldest first, and does what budget() prints. pull_request_target, because most
# PRs come from forks: only the base branch's gen/c/policy is checked out, no PR code runs. Nothing is ever
# closed. queen-* branches of this repository are exempt (owner, 2026-10-18).
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
permissions:
  contents: read
  pull-requests: write
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gen/c/policy, sparse-checkout-cone-mode: false }
      - name: Draft the PR over the cap, or promote held drafts, as the generated budget() prints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACT: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          N: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.ref }}
          U: ${{ github.event.pull_request.user.login }}
        run: |
          printf '#include "gen/c/policy/pr_budget.c"\n#include <stdio.h>\nint main(void){static char b[1<<20],o[1<<16];budget((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return 0;}\n' > budget.c
          cc -O1 -w -o budget budget.c
          k=C; case "$ACT" in opened|reopened|ready_for_review) [ "$DRAFT" = true ] || k=O;; esac
          x=0; if [ "$FORK" = true ]; then x=1; fi
          { echo "$k $x $N $REF"; gh pr list --state open --limit 1000 --json number,isDraft,isCrossRepository,headRefName,labels,author | jq -r --arg u "$U" --argjson n "$N" 'def l: sub("^app/";"") | sub("\\[bot\\]$";""); sort_by(.number)[] | select((.author.login | l) == ($u | l) and .number != $n) | "\(if .isDraft then (if any(.labels[]; .name == "pr-budget-held") then "H" else "D" end) else "R" end) \(if .isCrossRepository then 1 else 0 end) \(.number) \(.headRefName)"'; } > rows.txt
          ./budget < rows.txt | while read -r a p; do
            gh label create pr-budget-held --force -c ededed -d "Held as a draft by specs/policy/pr_budget.t27"
            if [ "$a" = draft ]; then gh pr ready "$p" --undo && gh pr edit "$p" --add-label pr-budget-held && gh pr comment "$p" -b "Held as a draft by the PR budget (specs/policy/pr_budget.t27, #10074): this author already has 20 open pull requests ready for review (OPEN_CAP). Nothing is closed: this one is marked ready again when a slot frees, oldest first. Batching port waves per ring or crate needs fewer PRs."
            else gh pr ready "$p" && gh pr edit "$p" --remove-label pr-budget-held && gh pr comment "$p" -b "A slot under the PR budget freed (specs/policy/pr_budget.t27, #10074): marked ready for review again."; fi || echo "::warning::pr-budget: $a $p failed"
          done
