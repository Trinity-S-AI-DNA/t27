name: Queue Health Report

# Hourly one-screen truth about the open PR queue: counts by merge state,
# armed auto-merges, drafts and opt-outs, written into one issue body, so
# degradation is visible in ten minutes, not months. Read-only: it merges
# nothing and arms nothing. Foreign file by owner approval, 2026-10-26.

on:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: write the queue health report into its issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          R=$(gh pr list --state open --limit 200 --json isDraft,mergeStateStatus,autoMergeRequest,labels)
          BODY=$(echo "$R" | jq -r '"Open PRs: \length",
            "BLOCKED: \([.[] | select(.mergeStateStatus=="BLOCKED")] | length)",
            "DIRTY: \([.[] | select(.mergeStateStatus=="DIRTY")] | length)",
            "CLEAN/UNSTABLE: \([.[] | select(.mergeStateStatus=="CLEAN" or .mergeStateStatus=="UNSTABLE")] | length)",
            "auto-merge armed: \([.[] | select(.autoMergeRequest != null)] | length)",
            "drafts: \([.[] | select(.isDraft)] | length)",
            "no-auto-merge: \([.[] | select(.labels | map(.name) | index("no-auto-merge"))] | length)"')
          NUM=$(gh issue list --search "queue health report in:title" --state open --json number --jq '.[0].number // ""')
          if [ -z "$NUM" ]; then gh issue create --title "queue health report" --body "($(date -u +%FT%TZ))

$BODY"
          else gh issue edit "$NUM" --body "($(date -u +%FT%TZ))

$BODY"; fi
