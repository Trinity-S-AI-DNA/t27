name: Own Language

# ONLY t27 (AGENTS.md). Rule: specs/policy/own_language.t27 -> gen/c/policy/own_language.c.
# Plumbing: cc one-line main + BASE foreign-exceptions + --ci + base...head diff. Twin: lefthook.yml.
# Override label owner-approved-foreign waives path check only, never the foreign-line budget.

on:
  pull_request:
    # No `branches:` filter, deliberately: a filter would make this gate silent
    # on a stacked pull request (scripts/ci/check_pr_branch_filters.py).
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: own-language-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  own-language:
    runs-on: ubuntu-24.04  # pin until #13057 regenerates gen/c; the ubuntu-26.04 compiler rejects the gen-c &out idiom (#13058)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Both ends of base...head are read out of git.
          fetch-depth: 0

      - name: Only t27 -- hand-written foreign code is denied
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'owner-approved-foreign') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '#include "gen/c/policy/own_language.c"\n#include <stdio.h>\nint main(void){static char b[1<<22],o[1<<22];unsigned n=check_all((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return n!=0;}\n' | cc -w -I . -x c -o "$RUNNER_TEMP/gate" -
          { git show "$BASE:tools/policy/foreign-exceptions.txt"; printf '\n--ci\n'; git diff --name-status "$BASE...$HEAD"; } > "$RUNNER_TEMP/in"
          "$RUNNER_TEMP/gate" < "$RUNNER_TEMP/in"

      - name: vf_guard write gate -- landing role (agent when possible)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '#include "gen/c/policy/vf_write_gate.c"\n#include <stdio.h>\nint main(void){static char b[1<<22],o[1<<22];unsigned n=check_vf_writes((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return n!=0;}\n' | cc -w -I . -x c -o "$RUNNER_TEMP/vf_gate" -
          { printf 'landing\n--\n'; git diff --name-status "$BASE...$HEAD"; } > "$RUNNER_TEMP/in"
          "$RUNNER_TEMP/vf_gate" < "$RUNNER_TEMP/in"

      # Budget holds on every PR (#7371); compiled from BASE so a PR cannot loosen it.
      - name: Foreign-line budget -- at most 40 added lines per file, 80 per PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE:gen/c/policy/own_language.c" > "$RUNNER_TEMP/gate.c"
          grep -q check_budget "$RUNNER_TEMP/gate.c" || git show "$HEAD:gen/c/policy/own_language.c" > "$RUNNER_TEMP/gate.c"
          printf '#include "gate.c"\n#include <stdio.h>\nint main(void){static char b[1<<22],o[1<<22];unsigned n=check_budget((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return n!=0;}\n' | cc -w -I "$RUNNER_TEMP" -x c -o "$RUNNER_TEMP/budget" -
          git diff --numstat --no-renames "$BASE...$HEAD" | "$RUNNER_TEMP/budget"

      - name: The owner approved foreign code in this pull request
        if: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved-foreign') }}
        run: echo "label owner-approved-foreign is set; the Only-t27 check is waived for this pull request"