name: t27o release
on:
  push:
    tags: ["t27o-v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p tri -p t27c
      - uses: sigstore/cosign-installer@v3
      - run: |
          mkdir dist && cp target/release/tri target/release/t27c dist/
          cd dist && shasum -a 256 tri t27c > "checksums-${GITHUB_REF_NAME}.txt"
      - run: for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
        working-directory: dist
      - uses: actions/attest-build-provenance@v4
        with: {subject-path: "dist/*"}
      - uses: softprops/action-gh-release@v2
        with: {files: "dist/*"}
