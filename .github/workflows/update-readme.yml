name: Update README Badges

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC (after census and t27o scan)
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to update (t27, trinity, trios, BrowserOS, 999-multibots-telegraf, ghashtag.github.io)'
        required: true
        default: 't27'
        type: choice
        options:
          - t27
          - trinity
          - trios
          - BrowserOS
          - 999-multibots-telegraf
          - ghashtag.github.io

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml
      
      - name: Run census to get foreign line data
        run: |
          python3 tools/census.py --output foreign_lines_census.txt
      
      - name: Run t27o scan to get coverage data
        run: |
          python3 tools/t27o-scan.py --output scan-results.json --report scan-report.md
      
      - name: Update README with badges
        run: |
          python3 tools/update-readme-badges.py
      
      - name: Generate documentation
        run: |
          python3 tools/update-readme-badges.py --generate-docs
      
      - name: Commit and push badge updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update quality badges and documentation'
          file_pattern: |
            README.md
            docs/
            foreign_lines_census.txt
            scan-results.json
          commit_user_name: 'badge-updater-bot'
          commit_user_email: 'badge-updater-bot@example.com'
          commit_author: 'badge-updater-bot <badge-updater-bot@example.com>'
          files: |
            README.md
            docs/
            foreign_lines_census.txt
            scan-results.json
      
      - name: Create issue with badge summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const censusData = fs.readFileSync('foreign_lines_census.txt', 'utf8');
            const scanData = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));
            
            const repo = context.event.inputs?.repository || 't27';
            const coverage = scanData.convertible_functions / scanData.total_functions * 100;
            const totalForeign = Object.values(scanData.language_stats || {}).reduce((sum, lang) => sum + lang.total, 0);
            
            const issueBody = `# Weekly Quality Report - ${repo} - ${new Date().toISOString().split('T')[0]}

## Summary
- **Repository**: ${repo}
- **Golden Coverage**: ${coverage.toFixed(1)}% (${scanData.convertible_functions}/${scanData.total_functions} functions)
- **Foreign Line Debt**: ${totalForeign} lines
- **Languages with Foreign Code**: ${Object.keys(scanData.language_stats || {}).length}

## Quality Gates Status
- ✅ Own-language shrink-only gate (FR-001): Installed
- ✅ DRY ratchet gate (FR-002): Installed  
- ✅ Secrets scanning (FR-003): Installed
- ✅ Foreign line debt table (FR-004): Published weekly
- ✅ t27o scanning and reporting (FR-005): Automated

## Golden PR Progress
- **Rust**: ${scanData.language_stats?.rust?.convertible || 0} functions convertible
- **Zig**: ${scanData.language_stats?.zig?.convertible || 0} functions convertible
- **Python**: ${scanData.language_stats?.python?.convertible || 0} functions convertible
- **TypeScript**: ${scanData.language_stats?.typescript?.convertible || 0} functions convertible

## Next Steps
${coverage < 50 ? '- Focus on converting more functions to .t27 specs' : '- Maintain current conversion rate'}
${totalForeign > 100 ? '- Continue reducing foreign line debt' : '- Foreign line debt is manageable'}

---

*This issue was automatically generated by the weekly badge update workflow.*
`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Quality Report - ${repo} - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['quality-report', 'weekly', 'automated']
            });