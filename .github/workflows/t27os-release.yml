name: t27os-release
on:
  workflow_dispatch:
    inputs: {owner_yes: {description: 'type yes to publish; anything else stops before a build', default: 'no'}}
permissions: {contents: write}
concurrency: t27os-release
jobs:
  release:
    if: inputs.owner_yes == 'yes' && github.ref == 'refs/heads/master'
    runs-on: macos-14
    timeout-minutes: 90
    environment: t27os-release
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: cargo build --release -p tri && ./target/release/tri t27os release --plan
      - run: ./target/release/tri t27os publish --yes
        env: {GH_TOKEN: '${{ github.token }}'}
