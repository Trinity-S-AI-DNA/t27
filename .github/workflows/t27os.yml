# T27 OS app gate (#11788): the window must not rot silently on master.
# make t27os builds T27OS.app and t27os-pty (specs/t27os/install.t27 is the
# product law; the Makefile names the same files). Apple silicon only
# (app_platform_ok): the macos-14 runner is arm64.
name: t27os-app
on:
  pull_request:
    paths: ['specs/t27os/**', 'Makefile', 'specs/tri/t27b/libm.t27', 'specs/tri/t27b/libm_plan.t27']
jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: |
          T27OS_BUILD=$(git rev-list --count HEAD) make t27os
      - name: The products exist and are signed
        run: |
          test -x target/t27os/T27OS.app/Contents/MacOS/T27OS
          test -x target/t27os/t27os-pty
          codesign -dv target/t27os/T27OS.app 2>&1 | grep -q Signature
      - uses: actions/upload-artifact@v4
        with:
          name: T27OS.app
          path: target/t27os/T27OS.app
