name: Needs boundary (only the template's shape may stay open)
# The owner's rule (#7498): no issue stays open without Boundary, User Scenarios, Requirements and
# Success Criteria. Templates cannot hold that line, because `gh issue create` and the REST API never see
# them. The rule is specs/policy/issue_shape.t27; gen/c/policy/issue_shape.c is its t27c gen-c output
# (L2). This file is plumbing: a one-line C main around the generated check_issue().
# A failing issue is closed as not planned, labelled shape-refused, and told what is missing. An edit
# that passes reopens it. Issues labelled epic or roadmap are containers and are skipped, as the Queen
# skips them.
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
concurrency:
  group: issue-shape-${{ github.event.issue.number }}
jobs:
  shape:
    if: ${{ !contains(github.event.issue.labels.*.name, 'epic') && !contains(github.event.issue.labels.*.name, 'roadmap') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gen/c/policy, sparse-checkout-cone-mode: false }
      - name: Judge the body with the generated check_issue()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          REFUSED: ${{ contains(github.event.issue.labels.*.name, 'shape-refused') }}
          STATE: ${{ github.event.issue.state }}
        run: |
          printf '#include "gen/c/policy/issue_shape.c"\n#include <stdio.h>\nint main(void){static char b[1<<20],o[1<<16];unsigned r=check_issue((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o);fputs(o,stdout);return r?1:0;}\n' > shape.c
          cc -O1 -w -o shape shape.c
          if printenv BODY | ./shape > why.txt; then
            if [ "$REFUSED" = true ]; then gh issue edit "$N" --remove-label shape-refused && gh issue reopen "$N" -c "The shape check passes now (specs/policy/issue_shape.t27); reopened."; fi
          elif [ "$STATE" = open ]; then
            { echo "Closed by the issue-shape gate (specs/policy/issue_shape.t27, #7498): an issue must have the template's sections. Edit the body; an edit that passes reopens it."; echo; sed 's/^/- /' why.txt; } > msg.md
            gh issue edit "$N" --add-label shape-refused && gh issue close "$N" --reason "not planned" --comment "$(cat msg.md)"
          fi
