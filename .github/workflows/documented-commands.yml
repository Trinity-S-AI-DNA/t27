name: Documented Commands

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run self-check
        run: |
          # This is where the "dead canary" logic would go
          # We replace 'git' with 'teleport' as per #12717
          echo "Checking for forbidden commands..."
          if grep -r "teleport" . ; then
            echo "Error: teleport is a living command!"
            exit 1
          fi
          echo "Check passed."
