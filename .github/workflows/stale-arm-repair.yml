# stale-arm-repair: runs stale_arm_repair (specs/crons/t27-train-watch.t27)
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  pull-requests: write
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            st=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$st" = "BEHIND" ] || [ "$st" = "DIRTY" ] || continue
            if [ "$st" = "DIRTY" ]; then
              if ! gh pr view "$pr" --json comments --jq '.comments[].body' | grep -q "author hands needed"; then
                gh pr comment "$pr" --body "stale-arm-repair: the branch conflicts with master -- author hands needed (the DIRTY-repair law, specs/crons/t27-train-watch-repair.t27)" || true
              fi
              continue
            fi
            if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx stale-repair-once; then
              gh pr comment "$pr" --body "stale-arm-repair: stale TWICE -- author hands needed (the stale_arm_repair law)" || true; gh pr edit "$pr" --remove-label stale-repair-once || true
              continue
            fi
            gh pr update-branch "$pr" && gh pr merge "$pr" --squash --auto; gh pr edit "$pr" --add-label stale-repair-once || true
          done
