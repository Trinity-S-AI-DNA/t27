name: stale-arm-repair
# Executes specs/crons/t27-train-watch.t27 stale_arm_repair: an armed PR stale
# once repairs itself (update-branch, checks rerun, still armed); stale twice
# needs hands (the author). Executor card: specs/crons/t27-train-watch-repair.t27.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  pull-requests: write
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            st=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$st" = "BEHIND" ] || [ "$st" = "DIRTY" ] || continue
            if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx stale-repair-once; then
              gh pr comment "$pr" --body "stale-arm-repair: stale TWICE -- author hands needed (the stale_arm_repair law)"
              gh pr edit "$pr" --remove-label stale-repair-once
              continue
            fi
            gh pr update-branch "$pr" && gh pr merge "$pr" --squash --auto
            gh pr edit "$pr" --add-label stale-repair-once
          done
