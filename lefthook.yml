# Git hooks for t27. Install once per clone: `lefthook install`
#
# own-language: the "Only t27" gate (AGENTS.md 'Only t27', owner rule 2026-10-05).
# The rule is specs/policy/own_language.t27; gen/c/policy/own_language.c is its
# `t27c gen-c` output. What follows is plumbing only: build a one-line C main
# around the generated check_all(), feed it the owner's exception list
# (tools/policy/foreign-exceptions.txt), a `--` line and `git diff --name-status`,
# exit non-zero on any DENY. No bypass is configured; never use --no-verify.
# The exception list is read from origin/master, never from the working tree: a
# branch cannot approve itself, an entry takes effect once the owner merged it.
#
# foreign-budget (owner rule 2026-10-07, #7371): check_budget() of the same file
# over `git diff --numstat`: at most 40 added hand-written foreign lines per file
# and 80 per diff. It reads no exception list; no label lifts it.
# The CI twin is .github/workflows/own-language.yml.
#
# secret-gate (#6433): requires gitleaks (`brew install gitleaks`). A missing
# gitleaks fails the hook on purpose: the secret gate must not silently turn
# itself off. Rules live in specs/policy/secret_gate.t27; its gen-c output
# gen/c/policy/secret_gate.c writes the config. The CI twin is secret-scan.yml.

pre-commit:
  commands:
    secret-gate:
      env:
        SECRET_GATE_SCAN: staged
      run: &secret-gate >-
        d=$(mktemp -d) &&
        printf '#include "gen/c/policy/secret_gate.c"\n#include <stdio.h>\nint main(void){static char o[1<<14];size_t n=gitleaks_toml((uint8_t*)o,sizeof o);if(n>sizeof o)return 3;fwrite(o,1,n,stdout);return 0;}\n'
        | cc -w -I . -x c -o "$d/cfg" - && "$d/cfg" > "$d/gitleaks.toml" &&
        { if [ "$SECRET_GATE_SCAN" = staged ]; then set -- --staged; else set -- --log-opts="HEAD --not --remotes"; fi;
        gitleaks git "$@" --no-banner --redact --config "$d/gitleaks.toml" .; }; s=$?; rm -rf "$d"; exit $s
    own-language:
      env:
        OWN_LANGUAGE_DIFF: --cached
      run: &own-language >-
        d=$(mktemp -d) &&
        printf '#include "gen/c/policy/own_language.c"\n#include <stdio.h>\nint main(void){static char b[1<<22],o[1<<22];unsigned n=check_all((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return n!=0;}\n'
        | cc -w -I . -x c -o "$d/gate" - &&
        { git show origin/master:tools/policy/foreign-exceptions.txt 2>/dev/null;
        printf '\n--\n'; git diff --name-status $OWN_LANGUAGE_DIFF; } > "$d/in" &&
        "$d/gate" < "$d/in"; s=$?; rm -rf "$d"; exit $s
    foreign-budget:
      env:
        OWN_LANGUAGE_DIFF: --cached
      run: &foreign-budget >-
        d=$(mktemp -d) &&
        printf '#include "gen/c/policy/own_language.c"\n#include <stdio.h>\nint main(void){static char b[1<<22],o[1<<22];unsigned n=check_budget((uint8_t*)b,fread(b,1,sizeof b,stdin),(uint8_t*)o,sizeof o-1);fputs(o,stdout);return n!=0;}\n'
        | cc -w -I . -x c -o "$d/gate" - &&
        git diff --numstat --no-renames $OWN_LANGUAGE_DIFF > "$d/in" &&
        "$d/gate" < "$d/in"; s=$?; rm -rf "$d"; exit $s

pre-push:
  commands:
    secret-gate:
      env:
        SECRET_GATE_SCAN: push
      run: *secret-gate
    own-language:
      env:
        OWN_LANGUAGE_DIFF: origin/master...HEAD
      run: *own-language
    foreign-budget:
      env:
        OWN_LANGUAGE_DIFF: origin/master...HEAD
      run: *foreign-budget
