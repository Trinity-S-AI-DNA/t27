    // Safari/WKWebView reports an interrupted fetch as the opaque
    // `TypeError: Load failed`. Fetch the WASM explicitly so the transfer has
    // a deadline and can be retried instead of escaping as an unhandled
    // top-level module rejection. The generated Trunk module calls this helper.
    window.__loadWasmWithRetry = async function(initFn, moduleUrl) {
      var attempts = 3;
      // MacIntel WebKit may legitimately spend 15–25 seconds compiling after
      // the body arrives. Keep the network deadline above that cold-start
      // window so the retry guard never aborts healthy compilation.
      var timeoutMs = 45000;
      var lastError;

      function setStatus(attempt) {
        var step = document.getElementById('loader-step');
        var bar = document.getElementById('loader-progress-bar');
        if (bar) bar.style.width = (20 + attempt * 20) + '%';
        if (step && attempt > 0) {
          step.textContent = 'Соединение прервалось — повтор загрузки ' + attempt + '/' + (attempts - 1) + '…';
        }
      }

      for (var attempt = 0; attempt < attempts; attempt++) {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, timeoutMs);
        try {
          setStatus(attempt);
          var response = await fetch(moduleUrl, {
            cache: attempt === 0 ? 'default' : 'reload',
            credentials: 'same-origin',
            signal: controller.signal
          });
          if (!response.ok) throw new Error('WASM HTTP ' + response.status);
          // Keep instantiateStreaming: buffering the whole 4.6 MB module before
          // compilation made low-end WebKit start noticeably later. The abort
          // signal still cancels the Response body if the stream stalls.
          var wasm = await initFn({ module_or_path: response });
          clearTimeout(timer);
          return wasm;
        } catch (error) {
          clearTimeout(timer);
          lastError = error;
          var message = String(error && (
            (error.name ? error.name + ': ' : '') + (error.message || error)
          ));
          var retryable = message.indexOf('Load failed') !== -1
            || message.indexOf('Failed to fetch') !== -1
            || message.indexOf('NetworkError') !== -1
            || message.indexOf('AbortError') !== -1
            || message.indexOf('WASM HTTP 408') !== -1
            || message.indexOf('WASM HTTP 429') !== -1
            || /WASM HTTP 5\d\d/.test(message);
          if (!retryable || attempt === attempts - 1) throw error;
          await new Promise(function(resolve) {
            setTimeout(resolve, 400 * (attempt + 1));
          });
        }
      }
      throw lastError;
    };

        // WASM load tracker — shows granular progress and handles failures
        (function() {
            var step = 0;
            var steps = ['Загрузка JS…', 'Загрузка WASM…', 'Компиляция…', 'Запуск…'];
            var stepEl = document.getElementById('loader-step');
            var barEl = document.getElementById('loader-progress-bar');
            function setProgress(pct, text) {
                if (barEl) barEl.style.width = pct + '%';
                if (stepEl && text) stepEl.textContent = text;
            }
            setProgress(10, steps[0]);

            window.addEventListener('TrunkApplicationStarted', function() {
                clearInterval(stepTimer);
                setProgress(100, 'Готово!');
                setTimeout(function() {
                    var preloader = document.getElementById('preloader');
                    if (preloader) preloader.classList.add('hidden');
                }, 300);
            });

            // Advance steps on a timer if Trunk hasn't fired yet
            var stepTimer = setInterval(function() {
                step++;
                if (step < steps.length) {
                    setProgress(10 + step * 20, steps[step]);
                }
                if (step >= steps.length) clearInterval(stepTimer);
            }, 1500);

            // A slow transfer is not a boot failure. Railway was observed
            // returning only 224 KB of the 730 KB Brotli WASM in two minutes;
            // the old 30s fatal overlay covered a download still in progress.
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader && !preloader.classList.contains('hidden')) {
                    setProgress(85, 'Медленное соединение — загрузка продолжается…');
                }
            }, 30000);

            // If the edge is exceptionally slow, keep waiting and offer a
            // cache-busted retry. Do not cover the page with a false fatal
            // error; real JS/WASM failures are reported by the catcher above.
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (!preloader || preloader.classList.contains('hidden')) return;
                setProgress(90, 'Сеть очень медленная. Можно подождать или повторить.');
                if (document.getElementById('loader-retry')) return;
                var retry = document.createElement('button');
                retry.id = 'loader-retry';
                retry.textContent = 'Повторить загрузку';
                retry.onclick = function() {
                    var url = new URL(location.href);
                    url.searchParams.set('retry', Date.now().toString());
                    location.replace(url.toString());
